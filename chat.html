<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>D-AI Web | Dutkyobot</title>
<link rel="icon" href="img/favicon.png" type="image/png">

<!-- 저장된 테마를 첫 페인트 전에 적용해서 화면이 잠깐 밝게 번쩍이는 걸 막는다 -->
<script>
  (function () {
    try {
      if (localStorage.getItem("dai_theme_v1") === "dark") {
        document.documentElement.classList.add("dark");
      }
    } catch (e) { /* 저장소 접근 불가 환경은 라이트 모드로 진행 */ }
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: "rgb(var(--c-bg) / <alpha-value>)",
          surface: "rgb(var(--c-surface) / <alpha-value>)",
          surface2: "rgb(var(--c-surface2) / <alpha-value>)",
          line: "rgb(var(--c-line) / <alpha-value>)",
          mute: "rgb(var(--c-mute) / <alpha-value>)",
          ink: "rgb(var(--c-ink) / <alpha-value>)",
          mint: "#21D67A",
          blue: "#3B9EFF",
          orange: "rgb(var(--c-orange) / <alpha-value>)",
          "orange-dark": "rgb(var(--c-orange-dark) / <alpha-value>)",
          discord: "#5865F2",
        },
        fontFamily: {
          sans: ["Pretendard Variable", "Pretendard", "sans-serif"],
        },
      },
    },
  };
</script>

<style>
  /* 메인 컬러는 진한 오렌지 하나로 통일한다. 민트→블루 그라데이션은
     사이드바 로고 아이콘 한 곳에만 남겨둔 브랜드 시그니처이고,
     그 외 UI 요소(아바타, 전송 버튼, 포인트 컬러 등)는 전부 오렌지를 쓴다.

     모든 색은 "R G B" 형태의 CSS 변수로 정의하고 rgb(var(--x) / a) 형태로
     사용한다. html.dark 가 붙으면 아래 값이 통째로 다크 팔레트로 바뀌면서
     Tailwind 유틸리티(bg-bg, text-ink 등)까지 자동으로 테마를 따라간다. */
  :root {
    /* 눈부심을 줄인 웜 라이트 팔레트: 순백색 면적과 강한 대비를 낮춘다 */
    --c-bg: 232 229 222;
    --c-surface: 244 242 237;
    --c-surface2: 222 219 211;
    --c-line: 208 203 193;
    --c-mute: 112 108 99;
    --c-ink: 47 44 39;
    --c-orange: 220 84 40;
    --c-orange-dark: 188 67 29;
    --c-shadow: 40 36 30;
    --c-sheen-alpha: 0.35;

    --c-mint: #21D67A;
    --c-blue: #3B9EFF;
  }

  html.dark {
    --c-bg: 23 22 20;
    --c-surface: 31 29 26;
    --c-surface2: 39 36 32;
    --c-line: 57 53 47;
    --c-mute: 163 156 143;
    --c-ink: 236 231 222;
    --c-orange: 237 133 96;
    --c-orange-dark: 214 103 61;
    --c-shadow: 0 0 0;
    --c-sheen-alpha: 0.05;
  }

  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background-color: rgb(var(--c-bg));
    color: rgb(var(--c-ink));
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid rgb(var(--c-orange));
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* 로고 아이콘 전용 그라데이션 — 이 클래스는 사이드바 로고 마크에만 사용한다 */
  .gradient-brand {
    background: linear-gradient(135deg, var(--c-mint) 0%, var(--c-blue) 100%);
  }

  /* 로고 텍스트: D- 는 민트, AI 는 블루(그라데이션 색), Web 은 사이트 메인 오렌지 */
  .brand-d { color: var(--c-mint); }
  .brand-ai { color: var(--c-blue); }
  .brand-web { color: rgb(var(--c-orange)); }

  /* 카드 컴포넌트 (랜딩 페이지 .card 토큰과 동일) */
  .card {
    background: rgb(var(--c-surface));
    border: 1px solid rgb(var(--c-line));
    border-radius: 28px;
    box-shadow: 0 1px 2px rgb(var(--c-shadow) / 0.04);
    transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    border-color: rgb(var(--c-orange) / 0.4);
    box-shadow: 0 8px 20px -8px rgb(var(--c-shadow) / 0.12);
  }

  /* 떠 있는 카드(모델 메뉴, 설정 모달)용 입체 그림자 — 헤더 글래스와 동일한 톤.
     위쪽 하이라이트 선은 --c-sheen-alpha로 다크 모드에서 자동으로 옅어진다. */
  .float-card {
    box-shadow:
      0 16px 32px -8px rgb(var(--c-shadow) / 0.16),
      inset 0 1px 0 rgb(255 255 255 / var(--c-sheen-alpha));
  }

  .invite-btn {
    transition: opacity 0.2s ease;
  }
  .invite-btn:hover {
    opacity: 0.88;
  }

  /* 부유형 헤더 컨트롤(사이드바 토글, 모델 선택 등)이 배경과 살짝
     분리되어 보이도록 미세한 그림자를 얹는다 */
  .float-pill {
    box-shadow: 0 1px 3px rgb(var(--c-shadow) / 0.06);
  }

  /* 스크롤바 */
  .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgb(var(--c-line)); border-radius: 999px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }

  /* 사이드바 슬라이드 (모바일 오버레이) */
  @media (max-width: 767px) {
    #sidebar { position: fixed; inset: 0 auto 0 0; z-index: 50; margin-left: -280px; }
    #sidebar.is-open { margin-left: 0; }
  }

  /* 상단 헤더 — 기본은 콘텐츠 위에 떠 있는 투명 상태, 스크롤하면
     랜딩 페이지 헤더(.is-floating)와 동일한 유리 질감으로 전환된다 */
  .app-header {
    background: transparent;
    border-bottom: 1px solid transparent;
    transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .app-header.is-scrolled {
    background: linear-gradient(180deg, rgb(var(--c-surface) / 0.9) 0%, rgb(var(--c-bg) / 0.85) 100%);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid rgb(var(--c-shadow) / 0.08);
    box-shadow:
      0 12px 24px -12px rgb(var(--c-shadow) / 0.12),
      inset 0 1px 0 rgb(255 255 255 / var(--c-sheen-alpha));
  }

  /* 사이드바 접기(레일) — ChatGPT/Gemini 스타일 아이콘 전용 상태.
     Tailwind의 w-[280px] 유틸과 충돌하지 않도록 너비를 여기서 직접 소유한다. */
  #sidebar {
    width: 280px;
    overflow-x: hidden;
    transition: width 0.22s cubic-bezier(0.22, 1, 0.36, 1), margin-left 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
  }
  #sidebar.is-collapsed { width: 76px; }
  #sidebar.is-collapsed .sidebar-label,
  #sidebar.is-collapsed .sidebar-search,
  #sidebar.is-collapsed #history-list {
    display: none;
  }
  /* 접힌 상태에선 로고와 펼치기 버튼을 세로로 쌓아서 폭 안에 자연스럽게 배치 */
  #sidebar.is-collapsed .logo-row {
    flex-direction: column;
    height: auto;
    gap: 10px;
    padding-top: 2px;
  }
  #sidebar.is-collapsed .logo-row a { padding: 0; }

  /* 레일의 모든 아이콘 버튼을 정확히 같은 크기(40px)로 통일 —
     로고만 사각형(브랜드 마크), 나머지는 원형(컨트롤)으로 형태만 구분 */
  #sidebar.is-collapsed .logo-row a > div,
  #sidebar.is-collapsed #sidebar-collapse-btn,
  #sidebar.is-collapsed #new-chat-btn,
  #sidebar.is-collapsed #settings-btn .avatar-badge {
    width: 40px;
    height: 40px;
    flex: none;
  }
  #sidebar.is-collapsed #sidebar-collapse-btn {
    background: rgb(var(--c-surface));
    border: 1px solid rgb(var(--c-line));
  }
  #sidebar.is-collapsed #sidebar-collapse-btn i,
  #sidebar.is-collapsed #settings-btn .avatar-badge i {
    font-size: 13px;
  }
  #sidebar.is-collapsed #new-chat-row { justify-content: center; margin-top: 14px; }
  #sidebar.is-collapsed #new-chat-btn { padding: 0; }
  #sidebar.is-collapsed #new-chat-btn i { font-size: 13px; }
  #sidebar.is-collapsed #settings-btn { justify-content: center; padding-left: 0; padding-right: 0; }

  /* 입력창 */
  .composer-shell {
    background: rgb(var(--c-surface));
    border: 1px solid rgb(var(--c-line));
    border-radius: 999px;
    box-shadow: 0 2px 10px -4px rgb(var(--c-shadow) / 0.08);
    transition: background-color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .composer-shell.is-multiline {
    border-radius: 999px;
  }
  .composer-shell:focus-within {
    border-color: rgb(var(--c-orange) / 0.5);
    box-shadow: 0 0 0 3px rgb(var(--c-orange) / 0.12);
  }
  #composer-input {
    background: transparent;
    color: rgb(var(--c-ink));
    resize: none;
    max-height: 200px;
  }
  #composer-input::placeholder { color: rgb(var(--c-mute)); }

  /* 채팅 이력 아이템 */
  .history-item {
    transition: background-color 0.15s ease;
  }
  .history-item:hover { background: rgb(var(--c-surface2)); }
  .history-item.is-active { background: rgb(var(--c-surface2)); }

  /* 프로바이더 체인 (시그니처 요소) */
  .chain-dot {
    width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0;
  }
  .chain-line {
    flex: 1; height: 1px; background: rgb(var(--c-line)); min-width: 12px;
  }

  /* 타이핑 인디케이터 */
  .typing-dot {
    width: 6px; height: 6px; border-radius: 999px;
    background: rgb(var(--c-mute));
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .msg-enter { animation: msg-in 0.25s ease both; }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chip {
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }
  .chip:hover { border-color: rgb(var(--c-orange) / 0.35); background: rgb(var(--c-orange) / 0.08); }

  /* 설정 모달의 라이트/다크 세그먼트 버튼 */
  .theme-option {
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .theme-option.is-active {
    background: rgb(var(--c-orange));
    color: #fff;
  }

  /* 사이드바 대화 아이템 액션(이름변경/삭제) */
  .sidebar-item-actions {
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .sidebar-item:hover .sidebar-item-actions,
  .sidebar-item-actions:focus-within {
    opacity: 1;
  }

  #composer-input:disabled { opacity: 0.6; }

  @media (prefers-color-scheme: light) {
    /* 시스템 라이트 환경에서도 수동 테마가 우선되도록 색상만 부드럽게 유지 */
  }

  html:not(.dark) .app-header.is-scrolled {
    backdrop-filter: blur(18px) saturate(110%);
    -webkit-backdrop-filter: blur(18px) saturate(110%);
    box-shadow:
      0 10px 22px -14px rgb(var(--c-shadow) / 0.10),
      inset 0 1px 0 rgb(255 255 255 / var(--c-sheen-alpha));
  }

  html:not(.dark) .float-card {
    box-shadow:
      0 14px 28px -12px rgb(var(--c-shadow) / 0.12),
      inset 0 1px 0 rgb(255 255 255 / var(--c-sheen-alpha));
  }



  /* ============================================================
     D-AI Web UI refresh — modern AI workspace layout
     Existing 기능/DOM은 유지하고 시각적 구조만 정돈한다.
     ============================================================ */
  :root {
    --ui-radius-lg: 22px;
    --ui-radius-md: 15px;
    --ui-content-width: 52rem;
  }

  body { letter-spacing: -0.01em; }

  /* Sidebar: compact, calm, app-like */
  #sidebar {
    width: 268px;
    background: rgb(var(--c-surface));
    border-right-color: rgb(var(--c-line) / 0.82);
  }
  #sidebar .p-3 { padding: 14px 12px; }
  #sidebar .logo-row {
    height: 34px;
    padding-inline: 4px;
  }
  #sidebar .logo-row a > div {
    box-shadow: 0 2px 8px rgb(var(--c-shadow) / 0.08);
  }
  #new-chat-row { margin-top: 14px; }
  #new-chat-btn {
    height: 42px;
    background: rgb(var(--c-surface2) / 0.55);
    border-color: rgb(var(--c-line) / 0.8);
    font-size: 13px;
    box-shadow: none;
  }
  #new-chat-btn:hover,
  #search-toggle-btn:hover {
    background: rgb(var(--c-surface2));
  }
  #search-toggle-btn {
    width: 42px;
    height: 42px;
    background: transparent;
    border-color: transparent;
  }
  #search-row input { background: rgb(var(--c-bg) / 0.65); }

  #history-list { padding-inline: 8px; margin-top: 8px; }
  #history-groups { gap: 18px !important; }
  #history-groups > div > div {
    padding-inline: 8px;
    margin-bottom: 6px;
    font-size: 10px;
    letter-spacing: 0.09em;
  }
  .history-item {
    border-radius: 11px;
    padding: 8px 10px;
    color: rgb(var(--c-mute) / 0.95);
  }
  .history-item:hover {
    background: rgb(var(--c-surface2) / 0.7);
    color: rgb(var(--c-ink));
  }
  .history-item.is-active {
    background: rgb(var(--c-surface2));
    color: rgb(var(--c-ink)) !important;
    box-shadow: inset 2px 0 0 rgb(var(--c-orange));
  }
  .sidebar-item-actions { padding-right: 4px; }

  #sidebar > .p-3:last-child {
    padding-top: 12px;
    padding-bottom: 14px;
  }
  #settings-btn {
    min-height: 42px;
    padding: 7px 9px;
    background: transparent;
    border: 1px solid transparent;
  }
  #settings-btn:hover {
    background: rgb(var(--c-surface2) / 0.72);
    border-color: rgb(var(--c-line) / 0.65);
  }
  #settings-btn .avatar-badge {
    width: 30px;
    height: 30px;
  }

  /* Main header: less pill-heavy, more like a native AI workspace */
  .app-header {
    height: 60px;
    padding-inline: 18px;
    background: rgb(var(--c-bg) / 0.74);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom-color: transparent;
  }
  .app-header.is-scrolled {
    background: rgb(var(--c-bg) / 0.88);
    border-bottom-color: rgb(var(--c-line) / 0.58);
    box-shadow: 0 8px 24px -18px rgb(var(--c-shadow) / 0.28);
  }
  #model-dropdown-btn {
    border: 0;
    background: transparent;
    box-shadow: none;
    padding: 7px 8px;
    border-radius: 10px;
  }
  #model-dropdown-btn:hover {
    background: rgb(var(--c-surface2) / 0.72);
    border-color: transparent;
  }
  #model-menu {
    top: 48px;
    width: 248px;
    max-width: calc(100vw - 24px);
    border-radius: 18px;
    padding: 6px;
  }
  #model-menu .model-option {
    border-radius: 12px;
    padding: 10px 11px;
    min-width: 0;
  }
  #model-menu .model-option > span {
    min-width: 0;
  }
  #model-menu .model-option:hover { background: rgb(var(--c-surface2) / 0.72); }

  /* Conversation canvas */
  #chat-scroll {
    scroll-behavior: smooth;
  }
  #empty-state {
    min-height: calc(100% - 16px);
    padding-top: 8vh;
    padding-bottom: 104px;
  }
  #empty-state > .w-14 {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    margin-bottom: 22px;
    box-shadow: 0 10px 26px -14px rgb(var(--c-orange) / 0.35);
  }
  #empty-state h1 {
    font-size: clamp(28px, 3vw, 36px);
    line-height: 1.08;
    letter-spacing: -0.045em;
  }
  #empty-state h1 > span { color: rgb(var(--c-ink)) !important; }
  #empty-state h1 > i { color: rgb(var(--c-orange)); }
  #empty-state > p {
    max-width: 31rem;
    font-size: 13px;
    margin-top: 11px;
  }
  #empty-state .suggestion-chip {
    min-height: 78px;
    border-radius: 16px;
    padding: 14px 15px;
    background: rgb(var(--c-surface) / 0.74);
    border-color: rgb(var(--c-line) / 0.68);
    box-shadow: 0 2px 9px rgb(var(--c-shadow) / 0.03);
  }
  #empty-state .suggestion-chip:hover {
    transform: translateY(-1px);
    border-color: rgb(var(--c-orange) / 0.28);
    background: rgb(var(--c-surface));
    box-shadow: 0 10px 24px -18px rgb(var(--c-shadow) / 0.24);
  }
  #empty-state .suggestion-chip > span:first-child {
    width: 31px;
    height: 31px;
    border-radius: 10px;
  }
  #empty-state .suggestion-chip > span:last-child { font-size: 13px; }

  .chain-line { opacity: 0.7; }
  #empty-state .max-w-xs { max-width: 17rem; }

  /* Messages: wider, quieter, more readable */
  #messages {
    max-width: var(--ui-content-width);
    padding-inline: 18px;
    padding-top: 30px;
    padding-bottom: 150px;
    gap: 32px;
  }
  #messages .msg-enter { gap: 12px; }
  #messages .msg-enter > .flex-1 > div:first-child {
    font-size: 14px;
    line-height: 1.78;
  }
  #messages .msg-enter .w-7.h-7 {
    width: 26px;
    height: 26px;
    border-radius: 9px;
    margin-top: 2px;
  }
  #messages .msg-enter .w-7.h-7 span { font-size: 9px; }
  #messages .msg-enter .bg-surface2[data-bubble] {
    border-radius: 18px 18px 6px 18px;
    padding: 9px 13px;
    background: rgb(var(--c-surface2) / 0.78);
    border-color: rgb(var(--c-line) / 0.62);
    line-height: 1.62;
  }
  #messages .msg-enter .mt-1\.5 {
    opacity: 0.88;
  }

  /* Composer: centerpiece of the UI */
  .flex-1.min-w-0.flex.flex-col.h-full.relative > .shrink-0.px-3.sm\:px-4 {
    padding: 8px 18px 16px;
    background: linear-gradient(180deg, transparent 0%, rgb(var(--c-bg) / 0.82) 28%, rgb(var(--c-bg)) 62%);
  }
  #composer-form { max-width: var(--ui-content-width); }
  .composer-shell {
    min-height: 58px;
    padding: 8px 10px 8px 17px;
    border-radius: var(--ui-radius-lg);
    background: rgb(var(--c-surface));
    border-color: rgb(var(--c-line) / 0.92);
    box-shadow:
      0 12px 34px -20px rgb(var(--c-shadow) / 0.34),
      0 1px 3px rgb(var(--c-shadow) / 0.06);
  }
  .composer-shell:focus-within {
    border-color: rgb(var(--c-orange) / 0.42);
    box-shadow:
      0 14px 34px -21px rgb(var(--c-shadow) / 0.36),
      0 0 0 3px rgb(var(--c-orange) / 0.08);
  }
  #composer-input { font-size: 14px; line-height: 1.65; padding-top: 7px; padding-bottom: 7px; }
  #send-btn {
    width: 40px;
    height: 40px;
    border-radius: 13px;

  historyGroupsEl: document.getElementById("history-groups"),
  historySearchEl: document.getElementById("history-search"),
  searchToggleBtn: document.getElementById("search-toggle-btn"),
  searchRow: document.getElementById("search-row"),

  settingsBtn: document.getElementById("settings-btn"),
  settingsModal: document.getElementById("settings-modal"),
  settingsCard: document.getElementById("settings-card"),
  settingsCloseBtn: document.getElementById("settings-close-btn"),
  settingsModelListEl: document.getElementById("settings-model-list"),
  persistToggle: document.getElementById("persist-toggle"),
  persistToggleKnob: document.getElementById("persist-toggle-knob"),
  settingsClearAllBtn: document.getElementById("settings-clear-all-btn"),
  themeSwitch: document.getElementById("theme-switch"),
};

const PROVIDERS = {
  gemini:     { label: "Gemini 2.5 Flash",        sub: "기본 모델 · 빠르고 균형 잡힌 응답" },
  cerebras:   { label: "Cerebras · GPT OSS 120B",  sub: "1순위 대체 · 초저지연 추론" },
  groq:       { label: "Groq · Llama 3.3 70B",     sub: "2순위 대체 · 가벼운 작업용" },
  openrouter: { label: "OpenRouter",               sub: "최종 대체 · 다중 무료 모델" },
};

const Utils = {
  uid() {
    return crypto.randomUUID
      ? crypto.randomUUID()
      : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  },
  escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  },
  scrollToBottom() {
    dom.chatScroll.scrollTop = dom.chatScroll.scrollHeight;
  },
  groupLabel(ts) {
    const d = new Date(ts);
    const now = new Date();
    const dayMs = 24 * 60 * 60 * 1000;
    const dOnly = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const nOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const diffDays = Math.round((nOnly - dOnly) / dayMs);
    if (diffDays <= 0) return "오늘";
    if (diffDays === 1) return "어제";
    if (diffDays <= 7) return "지난 7일";
    return "이전";
  },
};

const Theme = {
  apply(theme) {
    const isDark = theme === "dark";
    document.documentElement.classList.toggle("dark", isDark);
    if (dom.themeSwitch) {
      dom.themeSwitch.querySelectorAll(".theme-option").forEach(btn => {
        btn.classList.toggle("is-active", btn.dataset.theme === (isDark ? "dark" : "light"));
        btn.setAttribute("aria-pressed", String(btn.dataset.theme === (isDark ? "dark" : "light")));
      });
    }
  },
  load() {
    try {
      const saved = localStorage.getItem("dai_theme_v1");
      return saved === "dark" ? "dark" : "light";
    } catch (e) {
      return "light";
    }
  },
  set(theme) {
    const next = theme === "dark" ? "dark" : "light";
    try {
      localStorage.setItem("dai_theme_v1", next);
    } catch (e) {}
    this.apply(next);
  },
};

const Storage = {
  KEYS: {
    conversations: "dai_conversations_v1",
    current: "dai_current_conversation_v1",
    theme: "dai_theme_v1",
    persist: "dai_persist_enabled_v1",
    defaultModel: "dai_default_model_v1",
    sidebarCollapsed: "dai_sidebar_collapsed_v1",
  },

  loadPersistSetting() {
    try {
      const v = localStorage.getItem(this.KEYS.persist);
      return v === null ? true : v === "1"; // 기본값: 저장 켜짐
    } catch (e) { return true; }
  },
  savePersistSetting(enabled) {
    try { localStorage.setItem(this.KEYS.persist, enabled ? "1" : "0"); } catch (e) { }
  },

  loadDefaultModel() {
    try {
      const v = localStorage.getItem(this.KEYS.defaultModel);
      return (v && PROVIDERS[v]) ? v : "gemini";
    } catch (e) { return "gemini"; }
  },
  saveDefaultModel(key) {
    try { localStorage.setItem(this.KEYS.defaultModel, key); } catch (e) { }
  },

  loadConversations() {
    try {
      const raw = localStorage.getItem(this.KEYS.conversations);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.warn("대화 기록을 불러오지 못했어요:", e);
      return [];
    }
  },
  saveConversations(conversations) {
    if (!State.persistEnabled) return; // 저장 옵션이 꺼져 있으면 메모리에만 유지
    try {
      localStorage.setItem(this.KEYS.conversations, JSON.stringify(conversations));
    } catch (e) {
      console.warn("대화 기록을 저장하지 못했어요:", e);
    }
  },

  loadCurrentId() {
    try { return localStorage.getItem(this.KEYS.current); } catch (e) { return null; }
  },
  saveCurrentId(id) {
    if (!State.persistEnabled) return;
    try {
      if (id) localStorage.setItem(this.KEYS.current, id);
      else localStorage.removeItem(this.KEYS.current);
    } catch (e) { }
  },

  clearPersisted() {
    try {
      localStorage.removeItem(this.KEYS.conversations);
      localStorage.removeItem(this.KEYS.current);
    } catch (e) { }
  },

  loadSidebarCollapsed() {
    try { return localStorage.getItem(this.KEYS.sidebarCollapsed) === "1"; } catch (e) { return false; }
  },
  saveSidebarCollapsed(collapsed) {
    try { localStorage.setItem(this.KEYS.sidebarCollapsed, collapsed ? "1" : "0"); } catch (e) { }
  },
};

const State = {
  persistEnabled: Storage.loadPersistSetting(),
  defaultModelKey: Storage.loadDefaultModel(),
  conversations: Storage.loadConversations(),
  currentConversationId: null,
  isGenerating: false,
  abortController: null,

  getConversation(id) {
    return this.conversations.find(c => c.id === id) || null;
  },
  getCurrentConversation() {
    return this.currentConversationId ? this.getConversation(this.currentConversationId) : null;
  },
  setCurrentConversationId(id) {
    this.currentConversationId = id;
    Storage.saveCurrentId(id);
  },
  persist() {
    Storage.saveConversations(this.conversations);
  },
};

/**
 * 응답 생성 중일 때만 사용자에게 중단 여부를 확인하고, 동의하면 생성을 멈춘다.
 * 생성 중이 아니면 그냥 통과. 취소하면 false를 반환해 호출부에서 동작을 막는다.
 */
function confirmInterruptIfGenerating(message) {
  if (!State.isGenerating) return true;
  if (!window.confirm(message)) return false;
  Chat.stopGeneration();
  return true;
}

const Sidebar = {
  open() {
    dom.sidebar.classList.add("is-open");
    dom.sidebarBackdrop.classList.remove("hidden");
  },
  close() {
    dom.sidebar.classList.remove("is-open");
    dom.sidebarBackdrop.classList.add("hidden");
  },

  openSearch() {
    dom.searchRow.classList.remove("hidden");
    dom.historySearchEl.focus();
  },
  closeSearch() {
    dom.searchRow.classList.add("hidden");
    if (dom.historySearchEl.value) {
      dom.historySearchEl.value = "";
      this.render();
    }
  },

  applyCollapsed(collapsed) {
    dom.sidebar.classList.toggle("is-collapsed", collapsed);
    if (collapsed) this.closeSearch();
    if (dom.sidebarCollapseBtn) {
      dom.sidebarCollapseBtn.querySelector("i").className =
        "fa-solid " + (collapsed ? "fa-angles-right" : "fa-angles-left") + " text-[11px]";
      dom.sidebarCollapseBtn.setAttribute("aria-label", collapsed ? "사이드바 펼치기" : "사이드바 접기");
    }
  },

  updateHeaderScrollState() {
    if (!dom.appHeader) return;
    dom.appHeader.classList.toggle("is-scrolled", dom.chatScroll.scrollTop > 8);
  },

  render() {
    const query = dom.historySearchEl.value.trim().toLowerCase();
    const sorted = [...State.conversations].sort((a, b) => b.updatedAt - a.updatedAt);
    const filtered = query ? sorted.filter(c => c.title.toLowerCase().includes(query)) : sorted;

    const groups = { "오늘": [], "어제": [], "지난 7일": [], "이전": [] };
    filtered.forEach(c => groups[Utils.groupLabel(c.updatedAt)].push(c));

    dom.historyGroupsEl.innerHTML = "";

    if (!filtered.length) {
      const p = document.createElement("p");
      p.className = "text-[12px] text-mute px-2 py-6 text-center";
      p.textContent = query ? "검색 결과가 없어요" : "아직 대화가 없어요";
      dom.historyGroupsEl.appendChild(p);
      return;
    }

    Object.entries(groups).forEach(([label, items]) => {
      if (!items.length) return;
      dom.historyGroupsEl.appendChild(this._buildGroupSection(label, items));
    });
  },

  _buildGroupSection(label, items) {
    const section = document.createElement("div");

    const heading = document.createElement("div");
    heading.className = "text-[11px] font-semibold text-mute uppercase tracking-widest px-2 mb-1.5";
    heading.textContent = label;
    section.appendChild(heading);

    const ul = document.createElement("ul");
    ul.className = "space-y-0.5";
    items.forEach(c => ul.appendChild(this._buildItem(c)));
    section.appendChild(ul);

    return section;
  },

  _buildItem(conv) {
    const li = document.createElement("li");
    li.className = "sidebar-item relative flex items-center";
    const isActive = conv.id === State.currentConversationId;
    li.innerHTML = `
      <button data-id="${conv.id}" class="sidebar-conv-btn history-item ${isActive ? "is-active text-ink" : "text-mute hover:text-ink"} flex-1 min-w-0 text-left truncate pl-3 pr-1 py-2 rounded-full text-[13px]">${Utils.escapeHtml(conv.title)}</button>
      <span class="sidebar-item-actions flex items-center gap-0.5 pr-1 shrink-0">
        <button data-id="${conv.id}" class="sidebar-rename-btn w-6 h-6 rounded-full flex items-center justify-center text-mute hover:text-ink hover:bg-surface2" aria-label="이름 변경">
          <i class="fa-solid fa-pen text-[10px]"></i>
        </button>
        <button data-id="${conv.id}" class="sidebar-delete-btn w-6 h-6 rounded-full flex items-center justify-center text-mute hover:text-ink hover:bg-surface2" aria-label="삭제">
          <i class="fa-solid fa-trash-can text-[10px]"></i>
        </button>
      </span>`;
    return li;
  },

  renameConversation(id) {
    const conv = State.getConversation(id);
    if (!conv) return;
    const newTitle = window.prompt("대화 이름 변경", conv.title);
    if (newTitle === null) return;
    const trimmed = newTitle.trim();
    if (!trimmed) return;
    conv.title = trimmed.slice(0, 60);
    State.persist();
    this.render();
  },

  deleteConversation(id) {
    if (!window.confirm("이 대화를 삭제할까요? 되돌릴 수 없어요.")) return;
    State.conversations = State.conversations.filter(c => c.id !== id);
    State.persist();
    if (State.currentConversationId === id) {
      State.setCurrentConversationId(null);
      Messages.render(null);
      ModelPicker.updateHeader(State.defaultModelKey);
    }
    this.render();
  },
};

const ModelPicker = {
  updateHeader(providerKey) {
    const meta = PROVIDERS[providerKey] || { label: providerKey };
    dom.modelNameEl.textContent = meta.label;
    this._updateHeaderCheckmarks(providerKey);
  },

  _updateHeaderCheckmarks(providerKey) {
    document.querySelectorAll(".model-option").forEach(opt => {
      const check = opt.querySelector(".model-check");
      check.classList.toggle("opacity-100", opt.dataset.provider === providerKey);
      check.classList.toggle("opacity-0", opt.dataset.provider !== providerKey);
    });
  },

  select(providerKey) {
    this.updateHeader(providerKey);
    const conv = State.getCurrentConversation();
    if (conv) {
      conv.model = providerKey;
      conv.updatedAt = Date.now();
      State.persist();
    } else {
      State.defaultModelKey = providerKey;
      Storage.saveDefaultModel(providerKey);
    }
    dom.modelMenu.classList.add("hidden");
  },
};

const SettingsModal = {
  renderModelList() {
    dom.settingsModelListEl.innerHTML = Object.entries(PROVIDERS).map(([key, meta]) => `
      <button data-provider="${key}" class="settings-model-option w-full flex items-center gap-3 px-3 py-2.5 rounded-full hover:bg-orange/5 text-left">
        <span class="flex-1 min-w-0">
          <span class="block text-[13px] text-ink">${meta.label}</span>
        </span>
        <i class="fa-solid fa-check text-orange text-xs settings-model-check ${key === State.defaultModelKey ? "opacity-100" : "opacity-0"}"></i>
      </button>
    `).join("");
  },

  renderPersistToggle() {
    dom.persistToggle.classList.toggle("bg-orange", State.persistEnabled);
    dom.persistToggle.classList.toggle("bg-line", !State.persistEnabled);
    dom.persistToggleKnob.style.transform = State.persistEnabled ? "translateX(20px)" : "translateX(0)";
    dom.persistToggle.setAttribute("aria-checked", String(State.persistEnabled));
  },

  togglePersist() {
    State.persistEnabled = !State.persistEnabled;
    Storage.savePersistSetting(State.persistEnabled);
    this.renderPersistToggle();

    if (State.persistEnabled) {
      // 다시 켜면 지금 메모리에 있는 대화를 그대로 저장
      State.persist();
      State.setCurrentConversationId(State.currentConversationId);
    } else {
      // 끄면 이미 저장된 것도 즉시 지워서 "저장 안 함" 상태를 바로 반영
      Storage.clearPersisted();
    }
  },

  open() {
    this.renderModelList();
    this.renderPersistToggle();
    dom.settingsModal.classList.remove("hidden");
  },
  close() {
    dom.settingsModal.classList.add("hidden");
  },

  clearAll() {
    if (!confirmInterruptIfGenerating("응답을 생성하는 중이에요. 전체 삭제하면 중단돼요. 계속할까요?")) return;
    if (!window.confirm("모든 대화를 삭제할까요? 되돌릴 수 없어요.")) return;
    State.conversations = [];
    State.persist();
    State.setCurrentConversationId(null);
    Messages.render(null);
    ModelPicker.updateHeader(State.defaultModelKey);
    Sidebar.render();
    this.close();
  },
};

const Composer = {
  updateSendButtonState() {
    if (State.isGenerating) { dom.sendBtn.disabled = false; return; }
    dom.sendBtn.disabled = dom.input.value.trim().length === 0;
  },

  autoResize() {
    dom.input.style.height = "auto";
    dom.input.style.height = Math.min(dom.input.scrollHeight, 200) + "px";
    dom.composerShell.classList.add("is-multiline");
    this.updateSendButtonState();
  },

  setGenerating(active) {
    State.isGenerating = active;
    dom.input.disabled = active;
    dom.sendBtn.innerHTML = active
      ? '<i class="fa-solid fa-square text-xs"></i>'
      : '<i class="fa-solid fa-arrow-up text-sm"></i>';
    this.updateSendButtonState();
  },

  clear() {
    dom.input.value = "";
    this.autoResize();
  },
};

const Messages = {
  render(conv) {
    dom.messagesEl.innerHTML = "";

    if (!conv || conv.messages.length === 0) {
      dom.emptyState.classList.remove("hidden");
      dom.messagesEl.classList.add("hidden");
      return;
    }

    dom.emptyState.classList.add("hidden");
    dom.messagesEl.classList.remove("hidden");

    let lastAssistantIdx = -1;
    conv.messages.forEach((m, i) => { if (m.role === "assistant") lastAssistantIdx = i; });

    conv.messages.forEach((m, idx) => {
      dom.messagesEl.appendChild(
        m.role === "user"
          ? this._buildUserRow(conv.id, m)
          : this._buildAssistantRow(conv.id, m, idx === lastAssistantIdx)
      );
    });

    Utils.scrollToBottom();
  },

  _buildUserRow(convId, m) {
    const row = document.createElement("div");
    row.className = "msg-enter group flex justify-end items-start gap-2";
    row.innerHTML = `
      <button data-conv="${convId}" data-msg="${m.id}" class="edit-msg-btn opacity-0 group-hover:opacity-100 transition-opacity w-7 h-7 rounded-full flex items-center justify-center text-mute hover:text-ink hover:bg-surface2 shrink-0 mt-1" aria-label="메시지 수정">
        <i class="fa-solid fa-pen text-[11px]"></i>
      </button>
      <div class="max-w-[80%] bg-surface2 border border-line rounded-[22px] rounded-br-lg px-4 py-2.5 text-[14px] text-ink whitespace-pre-wrap break-words" data-bubble>${Utils.escapeHtml(m.content)}</div>
    `;
    return row;
  },

  _buildAssistantRow(convId, m, isLast) {
    const row = document.createElement("div");
    row.className = "msg-enter flex gap-3";
    const providerLabel = (PROVIDERS[m.model] && PROVIDERS[m.model].label) || m.model || "";
    row.innerHTML = `
      <div class="assistant-avatar w-7 h-7 rounded-full bg-orange flex items-center justify-center shrink-0 mt-0.5 overflow-hidden">
        <img src="img/icon.png" alt="D-AI" class="w-full h-full object-contain rounded-full p-1" loading="eager">
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-[14px] text-ink leading-relaxed whitespace-pre-wrap break-words">${Utils.escapeHtml(m.content)}</div>
        <div class="flex items-center gap-0.5 mt-1.5 -ml-1.5">
          <button class="copy-msg-btn w-7 h-7 rounded-full flex items-center justify-center text-mute hover:text-ink hover:bg-surface2" data-text="${encodeURIComponent(m.content)}" aria-label="복사">
            <i class="fa-regular fa-copy text-[12px]"></i>
          </button>
          ${isLast && !m.aborted ? `<button class="regen-msg-btn w-7 h-7 rounded-full flex items-center justify-center text-mute hover:text-ink hover:bg-surface2" data-conv="${convId}" aria-label="다시 생성">
            <i class="fa-solid fa-rotate-right text-[12px]"></i>
          </button>` : ""}
          <span class="text-[11px] text-mute flex items-center gap-1.5 ml-1.5">
            ${providerLabel}
          </span>
        </div>
      </div>`;
    return row;
  },

  appendTypingRow() {
    const id = "typing-" + Utils.uid();
    const row = document.createElement("div");
    row.id = id;
    row.className = "msg-enter flex gap-3";
    row.innerHTML = `
      <div class="assistant-avatar w-7 h-7 rounded-full bg-orange flex items-center justify-center shrink-0 mt-0.5 overflow-hidden">
        <img src="img/icon.png" alt="D-AI" class="w-full h-full object-contain rounded-full p-1" loading="eager">
      </div>
      <div class="flex items-center gap-1.5 h-7">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>`;
    dom.messagesEl.appendChild(row);
    Utils.scrollToBottom();
    return id;
  },

  removeRow(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  },

  handleCopy(btn) {
    const text = decodeURIComponent(btn.dataset.text);
    const icon = btn.querySelector("i");
    const markCopied = () => {
      icon.className = "fa-solid fa-check text-[12px] text-orange";
      setTimeout(() => { icon.className = "fa-regular fa-copy text-[12px]"; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(markCopied).catch(() => this._fallbackCopy(text, markCopied));
    } else {
      this._fallbackCopy(text, markCopied);
    }
  },

  _fallbackCopy(text, cb) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); cb(); } catch (e) { }
    document.body.removeChild(ta);
  },

  beginEdit(convId, msgId, btn) {
    if (State.isGenerating) return;
    const row = btn.closest(".group");
    const bubble = row.querySelector("[data-bubble]");
    const original = bubble.textContent;

    const wrap = document.createElement("div");
    wrap.className = "max-w-[80%] flex flex-col gap-2 items-end";
    wrap.innerHTML = `
      <textarea class="edit-textarea w-full bg-surface2 border border-orange/40 rounded-[20px] px-4 py-2.5 text-[14px] text-ink focus:outline-none" rows="2"></textarea>
      <div class="flex gap-2">
        <button type="button" class="cancel-edit-btn text-[12px] text-mute hover:text-ink px-3 py-1.5 rounded-full hover:bg-surface2">취소</button>
        <button type="button" class="save-edit-btn text-[12px] font-semibold text-white bg-orange hover:bg-orange-dark transition-colors px-3 py-1.5 rounded-full">저장하고 다시 전송</button>
      </div>`;
    bubble.replaceWith(wrap);

    const ta = wrap.querySelector(".edit-textarea");
    ta.value = original;
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);

    wrap.querySelector(".cancel-edit-btn").addEventListener("click", () => {
      this.render(State.getConversation(convId));
    });
    wrap.querySelector(".save-edit-btn").addEventListener("click", () => {
      const newText = ta.value.trim();
      if (!newText) return;
      Chat.saveEditAndResend(convId, msgId, newText);
    });
  },
};

const Chat = {
  createConversation() {
    return {
      id: Utils.uid(),
      title: "새 대화",
      model: State.defaultModelKey,
      messages: [],
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
  },

  /* ============================================================
     TODO: 실제 AI 연동 지점
     conversation.model  → 선택된 프로바이더 키 ("gemini" 등)
     conversation.messages → [{ role: "user" | "assistant", content }] 전체 대화 내역

     여기서 실제로 할 일:
     1) 아래 Promise 내부를, 백엔드(/api/chat 같은 엔드포인트)를
        fetch로 호출해 디스코드 봇과 동일한 폴백 체인
        (Gemini → Cerebras → Groq → OpenRouter)의 응답 문자열을
        resolve 하도록 바꾸면 됩니다.
     2) options.signal(AbortSignal)을 fetch에 그대로 넘기면
        "정지" 버튼이 실제 요청 중단까지 그대로 작동합니다.
     3) 실패 시 reject(error)만 해주면 에러 처리도 이미 되어 있습니다.

     이 함수 밖의 대화 저장/렌더링/재생성/중지/수정 로직은
     전부 이미 완성되어 있어 손댈 필요가 없습니다.
  ============================================================ */
  callAI(conversation, options = {}) {
    const { signal } = options;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        resolve("아직 실제 AI가 연결되지 않았어요. callAI() 함수 안에 API 호출만 넣으면 이 자리에 진짜 답변이 표시됩니다.");
      }, 900 + Math.random() * 500);

      if (signal) {
        if (signal.aborted) { clearTimeout(timer); reject(new DOMException("중단됨", "AbortError")); return; }
        signal.addEventListener("abort", () => {
          clearTimeout(timer);
          reject(new DOMException("중단됨", "AbortError"));
        });
      }
    });
  },

  async runAssistantTurn(conv) {
    Composer.setGenerating(true);
    const typingId = Messages.appendTypingRow();
    const controller = new AbortController();
    State.abortController = controller;

    try {
      const replyText = await this.callAI(conv, { signal: controller.signal });
      Messages.removeRow(typingId);
      conv.messages.push({ id: Utils.uid(), role: "assistant", content: replyText, model: conv.model, createdAt: Date.now() });
      conv.updatedAt = Date.now();
      State.persist();
      Messages.render(conv);
      Sidebar.render();
    } catch (err) {
      Messages.removeRow(typingId);
      if (err && err.name === "AbortError") {
        conv.messages.push({ id: Utils.uid(), role: "assistant", content: "생성이 중지됐어요.", model: conv.model, createdAt: Date.now(), aborted: true });
      } else {
        console.error("[AI 오류]", err);
        conv.messages.push({ id: Utils.uid(), role: "assistant", content: "답변을 가져오지 못했어요. 잠시 후 다시 시도해 주세요.", model: conv.model, createdAt: Date.now() });
      }
      conv.updatedAt = Date.now();
      State.persist();
      Messages.render(conv);
      Sidebar.render();
    } finally {
      Composer.setGenerating(false);
      State.abortController = null;
      Utils.scrollToBottom();
    }
  },

  stopGeneration() {
    if (State.abortController) State.abortController.abort();
  },

  regenerate(convId) {
    if (State.isGenerating) return;
    const conv = State.getConversation(convId);
    if (!conv) return;
    if (conv.messages.length && conv.messages[conv.messages.length - 1].role === "assistant") {
      conv.messages.pop();
    }
    Messages.render(conv);
    State.persist();
    this.runAssistantTurn(conv);
  },

  sendMessage(text) {
    if (State.isGenerating) return;

    let conv = State.getCurrentConversation();
    if (!conv) {
      conv = this.createConversation();
      State.conversations.unshift(conv);
      State.setCurrentConversationId(conv.id);
      ModelPicker.updateHeader(conv.model);
    }

    const isFirst = conv.messages.length === 0;
    conv.messages.push({ id: Utils.uid(), role: "user", content: text, createdAt: Date.now() });
    if (isFirst) conv.title = text.slice(0, 40) + (text.length > 40 ? "…" : "");
    conv.updatedAt = Date.now();

    State.persist();
    Messages.render(conv);
    Sidebar.render();
    Composer.clear();

    this.runAssistantTurn(conv);
  },

  saveEditAndResend(convId, msgId, newText) {
    const conv = State.getConversation(convId);
    if (!conv) return;
    const idx = conv.messages.findIndex(m => m.id === msgId);
    if (idx === -1) return;

    conv.messages[idx].content = newText;
    conv.messages = conv.messages.slice(0, idx + 1); // 이후 대화는 다시 생성되므로 제거
    conv.updatedAt = Date.now();
    State.persist();
    Messages.render(conv);
    Sidebar.render();
    this.runAssistantTurn(conv);
  },

  switchConversation(id) {
    if (id === State.currentConversationId) { Sidebar.close(); return; }
    if (!confirmInterruptIfGenerating("응답을 생성하는 중이에요. 대화를 전환하면 중단돼요. 계속할까요?")) return;

    const conv = State.getConversation(id);
    if (!conv) return;
    State.setCurrentConversationId(id);
    Messages.render(conv);
    Sidebar.render();
    ModelPicker.updateHeader(conv.model);
    Sidebar.close();
  },

  newChat() {
    if (!confirmInterruptIfGenerating("응답을 생성하는 중이에요. 새 대화를 시작하면 중단돼요. 계속할까요?")) return;

    State.setCurrentConversationId(null);
    Messages.render(null);
    Sidebar.render();
    ModelPicker.updateHeader(State.defaultModelKey);
    Composer.clear();
    Sidebar.close();
  },
};

function bindEvents() {
  dom.sidebarToggle.addEventListener("click", () => {
    dom.sidebar.classList.contains("is-open") ? Sidebar.close() : Sidebar.open();
  });
  dom.sidebarBackdrop.addEventListener("click", () => Sidebar.close());

  if (dom.searchToggleBtn) {
    dom.searchToggleBtn.addEventListener("click", () => {
      dom.searchRow.classList.contains("hidden") ? Sidebar.openSearch() : Sidebar.closeSearch();
    });
  }
  dom.historySearchEl.addEventListener("input", () => Sidebar.render());
  dom.historySearchEl.addEventListener("keydown", (e) => {
    if (e.key === "Escape") Sidebar.closeSearch();
  });

  if (dom.sidebarCollapseBtn) {
    Sidebar.applyCollapsed(Storage.loadSidebarCollapsed());
    dom.sidebarCollapseBtn.addEventListener("click", () => {
      const collapsed = !dom.sidebar.classList.contains("is-collapsed");
      Sidebar.applyCollapsed(collapsed);
      Storage.saveSidebarCollapsed(collapsed);
    });
  }

  dom.chatScroll.addEventListener("scroll", () => Sidebar.updateHeaderScrollState(), { passive: true });

  dom.historyGroupsEl.addEventListener("click", (e) => {
    const renameBtn = e.target.closest(".sidebar-rename-btn");
    if (renameBtn) { e.stopPropagation(); Sidebar.renameConversation(renameBtn.dataset.id); return; }

    const deleteBtn = e.target.closest(".sidebar-delete-btn");
    if (deleteBtn) { e.stopPropagation(); Sidebar.deleteConversation(deleteBtn.dataset.id); return; }

    const convBtn = e.target.closest(".sidebar-conv-btn");
    if (convBtn) { Chat.switchConversation(convBtn.dataset.id); }
  });

  dom.modelBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    dom.modelMenu.classList.toggle("hidden");
  });
  document.addEventListener("click", () => dom.modelMenu.classList.add("hidden"));
  dom.modelMenu.addEventListener("click", (e) => e.stopPropagation());
  document.querySelectorAll(".model-option").forEach(opt => {
    opt.addEventListener("click", () => ModelPicker.select(opt.dataset.provider));
  });

  dom.settingsModelListEl.addEventListener("click", (e) => {
    const opt = e.target.closest(".settings-model-option");
    if (!opt) return;
    State.defaultModelKey = opt.dataset.provider;
    Storage.saveDefaultModel(State.defaultModelKey);
    SettingsModal.renderModelList();
    if (!State.currentConversationId) ModelPicker.updateHeader(State.defaultModelKey);
  });
  dom.persistToggle.addEventListener("click", () => SettingsModal.togglePersist());
  if (dom.themeSwitch) {
    dom.themeSwitch.addEventListener("click", (e) => {
      const btn = e.target.closest(".theme-option");
      if (!btn) return;
      Theme.set(btn.dataset.theme);
    });
  }
  dom.settingsBtn.addEventListener("click", () => SettingsModal.open());
  dom.settingsCloseBtn.addEventListener("click", () => SettingsModal.close());
  dom.settingsModal.addEventListener("click", (e) => {
    if (!dom.settingsCard.contains(e.target)) SettingsModal.close();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !dom.settingsModal.classList.contains("hidden")) SettingsModal.close();
  });
  dom.settingsClearAllBtn.addEventListener("click", () => SettingsModal.clearAll());

  dom.input.addEventListener("input", () => Composer.autoResize());
  dom.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      dom.form.requestSubmit();
    }
  });

  dom.messagesEl.addEventListener("click", (e) => {
    const copyBtn = e.target.closest(".copy-msg-btn");
    if (copyBtn) { Messages.handleCopy(copyBtn); return; }

    const regenBtn = e.target.closest(".regen-msg-btn");
    if (regenBtn) { Chat.regenerate(regenBtn.dataset.conv); return; }

    const editBtn = e.target.closest(".edit-msg-btn");
    if (editBtn) { Messages.beginEdit(editBtn.dataset.conv, editBtn.dataset.msg, editBtn); return; }
  });

  document.getElementById("new-chat-btn").addEventListener("click", () => Chat.newChat());
  document.getElementById("mobile-new-chat").addEventListener("click", () => Chat.newChat());

  dom.form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (State.isGenerating) { Chat.stopGeneration(); return; }
    const text = dom.input.value.trim();
    if (!text) return;
    Chat.sendMessage(text);
  });

  document.querySelectorAll(".suggestion-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      if (State.isGenerating) return;
      const text = chip.querySelector("span:last-child").textContent;
      Chat.sendMessage(text);
    });
  });
}

function init() {
  Theme.apply(Theme.load());
  bindEvents();

  const savedId = Storage.loadCurrentId();
  const savedConv = savedId ? State.getConversation(savedId) : null;

  if (savedConv) {
    State.currentConversationId = savedConv.id;
    Messages.render(savedConv);
    ModelPicker.updateHeader(savedConv.model);
  } else {
    State.currentConversationId = null;
    Messages.render(null);
    ModelPicker.updateHeader(State.defaultModelKey);
  }
  Sidebar.render();
}

init();
</script>
