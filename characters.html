<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>D-AI Character Chat</title>
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="shared-api.js"></script>
<style>
:root{color-scheme:dark;--bg:#09090b;--surface:#18181b;--surface2:#222226;--line:#303036;--ink:#f8f8fa;--mute:#a1a1aa;--accent:#a78bfa;--mint:#21d67a;--blue:#3b9eff;--danger:#fb7185}
html:not(.dark){color-scheme:light;--bg:#f5f6f8;--surface:#fff;--surface2:#eff0f3;--line:#dfe1e6;--ink:#18181b;--mute:#737782;--accent:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:-.01em}
button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{width:290px;flex:0 0 290px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sidebar-top{padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-bottom:18px}
.brand-icon{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--mint),var(--blue));color:#07110d;font-weight:900;display:grid;place-items:center}
.brand-name{font-size:15px;font-weight:800;letter-spacing:-.03em}.brand-name em{font-style:normal;color:var(--blue)}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px}
.mode-btn{border:0;background:transparent;border-radius:999px;padding:10px 5px;font-size:12px;font-weight:700;color:var(--mute)}
.mode-btn.active{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.side-heading{display:flex;justify-content:space-between;align-items:center;padding:15px 16px 8px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent}.btn.danger{color:var(--danger)}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:0 0 auto}
.icon-btn:hover{border-color:var(--accent)}
#side-list{flex:1;min-height:0;overflow:auto;padding:0 10px 16px}
.section-label{padding:13px 8px 6px;color:var(--mute);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.list-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:13px;margin-bottom:3px;border:1px solid transparent}
.list-row.active{background:var(--surface2);border-color:var(--line)}.list-row:hover{background:var(--surface2)}
.list-select{display:flex;align-items:center;gap:9px;flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.avatar{flex:0 0 31px;width:31px;height:31px;display:grid;place-items:center;border-radius:11px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--accent) 75%,var(--blue));color:white}
.list-copy{min-width:0;display:flex;flex-direction:column;gap:3px}.list-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;gap:2px}.mini-btn{border:0;background:transparent;color:var(--mute);width:26px;height:26px;border-radius:50%;font-size:12px;display:grid;place-items:center}
.mini-btn:hover{background:var(--line);color:var(--ink)}
.side-bottom{padding:12px;border-top:1px solid var(--line);display:flex;gap:7px}.side-bottom .btn{flex:1}
.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100%;position:relative}
.header{height:68px;flex:0 0 68px;padding:0 clamp(12px,2.3vw,26px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px;background:color-mix(in srgb,var(--bg) 88%,transparent);z-index:2}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}.header-title{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub{font-size:11px;color:var(--mute);margin-top:3px}.header-actions{display:flex;align-items:center;gap:6px}.header-actions .btn{padding:8px 11px}
#mobile-menu{display:none}
.messages{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:900px;margin:0 auto;padding:24px clamp(14px,3vw,34px) 28px;display:flex;flex-direction:column;gap:18px}
.empty{margin:auto;text-align:center;max-width:440px;padding:35px 20px;color:var(--mute)}.empty-mark{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--mint),var(--blue));display:grid;place-items:center;color:#06130c;font-size:20px;font-weight:900;margin:0 auto 18px}
.empty h1{font-size:23px;letter-spacing:-.04em;color:var(--ink);margin:0 0 10px}.empty p{font-size:13px;line-height:1.7;margin:0}
.message{display:flex;gap:10px;max-width:88%;align-items:flex-start;animation:rise .18s ease-out}.message.me{align-self:flex-end;flex-direction:row-reverse}.message.ai{align-self:flex-start}
.message.system{align-self:center;max-width:100%;font-size:11px;color:var(--mute);text-align:center;background:var(--surface2);border:1px solid var(--line);padding:8px 12px;border-radius:12px}
.message .avatar{width:29px;height:29px;flex-basis:29px;border-radius:10px}.msg-col{min-width:0;display:flex;flex-direction:column;gap:5px}
.msg-meta{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--mute);padding:0 2px}.message.me .msg-meta{justify-content:flex-end}
.msg-bubble{font-size:14px;line-height:1.72;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--surface);padding:11px 14px;border-radius:17px}
.message.me .msg-bubble{background:color-mix(in srgb,var(--accent) 15%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,var(--line));border-top-right-radius:5px}.message.ai .msg-bubble{border-top-left-radius:5px}
.msg-actions{display:flex;gap:3px;opacity:.78}.message.me .msg-actions{justify-content:flex-end}.msg-actions button{border:0;background:transparent;color:var(--mute);border-radius:8px;padding:4px 6px;font-size:10px}.msg-actions button:hover{background:var(--surface2);color:var(--ink)}
.action-text{font-style:italic;color:var(--accent)}.mention{color:var(--accent);font-weight:700}
.typing{display:flex;align-items:center;gap:5px;padding:10px 13px;color:var(--mute);font-size:11px}.typing span{width:5px;height:5px;border-radius:50%;background:var(--mute);animation:bounce 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.composer-area{padding:10px 14px max(15px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}.composer-wrap{max-width:850px;margin:0 auto}
.composer{border:1px solid var(--line);background:var(--surface);border-radius:23px;display:flex;align-items:flex-end;gap:8px;padding:9px 10px 9px 16px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
#message-input{border:0;outline:0;resize:none;min-height:30px;max-height:160px;flex:1;background:transparent;color:var(--ink);font-size:14px;line-height:1.6;padding:5px 0}#message-input::placeholder{color:var(--mute)}
#send-btn{width:36px;height:36px;border:0;border-radius:50%;background:var(--accent);color:white;font-size:15px;flex:0 0 auto}.composer-note{text-align:center;font-size:10px;color:var(--mute);padding-top:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);backdrop-filter:blur(3px);z-index:40;display:none}.overlay.show{display:block}
.dialog{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.dialog.show{display:flex}
.dialog-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;width:min(590px,100%);max-height:min(86dvh,850px);overflow:auto;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.28)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.dialog-head h2{font-size:17px;margin:0}
.field-group{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field-group label{font-size:11px;font-weight:700;color:var(--mute)}
.field,.field-group input,.field-group textarea,.field-group select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:13px;outline:none}
.field-group textarea{resize:vertical;min-height:92px;line-height:1.6}.field-hint{font-size:10px;color:var(--mute);line-height:1.6;margin:0}
.dialog-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.member-card{border:1px solid var(--line);background:var(--bg);border-radius:15px;padding:12px;margin-bottom:10px}
.member-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.member-card-head input{flex:1;min-width:0}
.small-title{font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.04em;margin:18px 0 9px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--surface2);border:1px solid var(--line);padding:10px 15px;border-radius:999px;font-size:12px;z-index:90;transition:.2s;max-width:calc(100vw - 28px)}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes bounce{0%,70%,100%{opacity:.35;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
@media(max-width:760px){.sidebar{position:fixed;z-index:45;inset:0 auto 0 0;width:min(310px,88vw);transform:translateX(-105%);transition:transform .22s ease;box-shadow:15px 0 50px rgba(0,0,0,.2)}.sidebar.open{transform:translateX(0)}#mobile-menu{display:grid}.header{height:60px;flex-basis:60px;padding-inline:10px}.header-actions{gap:4px}.header-actions .btn .long-label{display:none}.header-actions .btn{padding:8px 10px}.messages{padding:17px 12px 23px}.message{max-width:96%}.msg-bubble{font-size:13.5px}.composer-area{padding-inline:9px}.dialog-card{padding:17px;border-radius:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a class="brand" href="index.html"><div class="brand-icon">D</div><div class="brand-name">D-<em>AI</em> <span style="color:var(--mute);font-weight:600">Character</span></div></a>
      <div class="mode-switch"><button class="mode-btn active" data-mode="one">1:1 모드</button><button class="mode-btn" data-mode="group">단체 모드</button></div>
    </div>
    <div class="side-heading"><span id="side-title">나의 캐릭터</span><button class="btn" id="side-add">+ 추가</button></div>
    <div id="side-list"></div>
    <div class="side-bottom"><a class="btn quiet" href="chat.html" style="text-decoration:none">일반 채팅</a><button class="btn" id="settings-open">⚙ 설정</button></div>
  </aside>
  <div class="overlay" id="sidebar-overlay"></div>
  <main class="main">
    <header class="header">
      <div class="header-left"><button class="icon-btn" id="mobile-menu" aria-label="메뉴 열기">☰</button><div style="min-width:0"><div class="header-title" id="header-title">이든</div><div class="header-sub" id="header-sub">1:1 캐릭터 대화</div></div></div>
      <div class="header-actions">
        <button class="btn quiet hidden" id="auto-btn" title="AI 자동 대화 켜기/끄기">▶ <span class="long-label">자동 대화</span></button>
        <button class="btn quiet" id="edit-btn">✎ <span class="long-label">설정</span></button>
        <button class="btn quiet" id="export-btn" title="현재 대화 내보내기">⇩ <span class="long-label">내보내기</span></button>
        <button class="btn primary" id="new-btn">+ <span id="new-label">새 대화</span></button>
      </div>
    </header>
    <section class="messages" id="messages" aria-live="polite" role="log"></section>
    <div class="composer-area"><div class="composer-wrap">
      <form class="composer" id="composer-form"><textarea id="message-input" rows="1" placeholder="메시지 보내기" autocomplete="off"></textarea><button id="send-btn" type="submit" aria-label="보내기">↑</button></form>
      <div class="composer-note" id="composer-note">Enter 전송 · Shift+Enter 줄바꿈 · API 키는 설정에서 관리</div>
    </div></div>
  </main>
</div>
<div class="dialog" id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="dialog-card">
    <div class="dialog-head"><h2 id="settings-title">공통 설정</h2><button class="icon-btn" data-close="settings-dialog" aria-label="닫기">✕</button></div>
    <div class="field-group"><label for="api-key">Gemini API 키</label><input id="api-key" type="password" autocomplete="off" placeholder="AIzaSy…"><p class="field-hint">일반 채팅·1:1 모드·단체 모드가 이 키를 함께 사용합니다. 정적 웹사이트이므로 키는 현재 브라우저 저장소에 저장됩니다.</p></div>
    <div class="field-group"><label for="api-model">공통 모델 ID</label><input id="api-model" list="model-options" value="gemini-3.1-flash-lite" spellcheck="false"><datalist id="model-options"><option value="gemini-3.1-flash-lite"><option value="gemini-3.6-flash"><option value="gemini-3.5-flash-lite"></datalist><p class="field-hint">기본은 Gemini 3.1 Flash-Lite로, 빠르고 비용 효율적인 대화에 맞췄어요. 사용 가능 모델과 호출 한도는 Google AI Studio 프로젝트 설정을 따릅니다.</p></div>
    <div class="field-group"><label>화면 테마</label><div class="mode-switch"><button class="mode-btn" id="theme-light" type="button">☀ 라이트</button><button class="mode-btn active" id="theme-dark" type="button">☾ 다크</button></div></div>
    <div class="dialog-footer"><button class="btn" data-close="settings-dialog">닫기</button><button class="btn primary" id="save-settings">설정 저장</button></div>
  </div>
</div>
<div class="dialog" id="editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editor-title">
  <div class="dialog-card"><div class="dialog-head"><h2 id="editor-title">편집</h2><button class="icon-btn" data-close="editor-dialog" aria-label="닫기">✕</button></div>
    <form id="editor-form"><div id="editor-content"></div><div class="dialog-footer"><button type="button" class="btn" data-close="editor-dialog">취소</button><button type="submit" class="btn primary">저장</button></div></form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const clone = value => JSON.parse(JSON.stringify(value));
const fmt = value => { const d=new Date(value||Date.now()); return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); };
const DEFAULT_CHARACTERS = [{id:'character-eden',name:'이든',personality:'옆자리에 앉은 회사 동기로, 겉으로는 능청스럽고 장난기 가득한 태도로 실없는 농담을 던지지만 속으로는 상대의 컨디션과 기분을 세심하게 살피는 다정한 성격이다. 상대가 지쳐 보이면 괜히 우스갯소리로 분위기를 풀어주려 하고, 정작 걱정하는 티는 최대한 안 내려고 딴청을 피우는 버릇이 있다.',greeting:'*커피 두 잔을 들고 자리로 다가와 하나를 쓱 내민다* 어, 딱 맞춰 왔네. *씩 웃으며 옆자리에 걸터앉는다* 얼굴이 반쪽인데? 무슨 일 있었어, 나한테 다 말해봐.',userName:'플레이어'}];
const DEFAULT_MEMBERS = [
 {id:'member-alpha',sourceCharacterId:null,name:'알파',personality:'모임 총무 포지션. 얘기가 흩어지면 다시 모으고, 다른 애들한테 질문을 잘 던진다.',hue:215},
 {id:'member-luna',sourceCharacterId:null,name:'루나',personality:'호기심이 많고 엉뚱한 생각을 자주 한다. 새벽 감성이 있다.',hue:275},
 {id:'member-jay',sourceCharacterId:null,name:'제이',personality:'개발자. 근거 없는 말에는 바로 태클을 걸지만 은근히 사람을 잘 챙긴다.',hue:38},
 {id:'member-baby',sourceCharacterId:null,name:'베이비',personality:'막내. 눈치 안 보고 생각나는 대로 던진다.',hue:150}
];
const STORE_KEY='dai_character_workspace_v1';
const freshRoom = () => ({id:'room-default',name:'기본 단체방',worldSetting:'현대의 친근한 온라인 친구 모임. 멤버들은 각자의 성격과 말투를 유지하며 자연스럽게 대화한다. 현실적인 채팅처럼 짧게 말하고, 서로의 말을 기억하며 대화한다.',members:clone(DEFAULT_MEMBERS),log:[],dms:{},autoEnabled:false,autoInterval:25,maxAuto:6,createdAt:Date.now()});
function loadWorkspace(){
 try{const raw=localStorage.getItem(STORE_KEY);if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.characters)&&Array.isArray(s.rooms))return {...s,version:1};}}
 catch(e){console.warn('작업공간을 불러오지 못했습니다.',e);}
 return {version:1,mode:'one',characters:clone(DEFAULT_CHARACTERS),rooms:[freshRoom()],activeCharacterId:DEFAULT_CHARACTERS[0].id,activeRoomId:'room-default',activeConversationByCharacter:{},conversationsByCharacter:{},activeRoomView:{}};
}
let W=loadWorkspace(), activeController=null, generationToken=0, generating=false, editorDraft=null, toastTimer=null, autoCountByRoom={};
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(W));}catch(e){toast('저장 공간이 부족해요. 대화를 내보내고 일부 오래된 기록을 정리해 주세요.');}}
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
function currentCharacter(){return W.characters.find(c=>c.id===W.activeCharacterId)||W.characters[0]||null;}
function currentRoom(){return W.rooms.find(r=>r.id===W.activeRoomId)||W.rooms[0]||null;}
function conversationsFor(characterId){if(!W.conversationsByCharacter[characterId])W.conversationsByCharacter[characterId]=[];return W.conversationsByCharacter[characterId];}
function currentConversation(){const c=currentCharacter();if(!c)return null;const id=W.activeConversationByCharacter[c.id];return conversationsFor(c.id).find(x=>x.id===id)||null;}
function ensureConversation(){const c=currentCharacter();if(!c)return null;let conv=currentConversation();if(conv)return conv;conv={id:uid(),characterId:c.id,title:'새 대화',model:DAIShared.getModel(),createdAt:Date.now(),updatedAt:Date.now(),messages:[]};if(c.greeting)conv.messages.push({id:uid(),role:'assistant',text:c.greeting,time:Date.now()});conversationsFor(c.id).unshift(conv);W.activeConversationByCharacter[c.id]=conv.id;save();return conv;}
function activeGroupView(){const r=currentRoom();if(!r)return 'group';return W.activeRoomView[r.id]||'group';}
function setGroupView(value){const r=currentRoom();if(!r)return;W.activeRoomView[r.id]=value;save();}
function cancelGeneration(){generationToken++;if(activeController){try{activeController.abort();}catch(e){}activeController=null;}generating=false;setBusy(false);}
function setBusy(on){generating=on;$('#send-btn').disabled=on;$('#message-input').disabled=on;$('#send-btn').textContent=on?'■':'↑';}
function highlightMarkup(text,room=null){let out=esc(text).replace(/\[\*([^*\]]+)\*\]/g,'<span class="action-text">$1</span>').replace(/\*([^\*\n]+)\*/g,'<span class="action-text">$1</span>').replace(/\n/g,'<br>');if(room)room.members.forEach(m=>{const re=new RegExp('@'+m.name.replace(/[.*+?^\${}()|[\]\\]/g,'\\$&'),'g');out=out.replace(re,'<span class="mention">@'+esc(m.name)+'</span>');});return out;}
function openDialog(id){$('#'+id).classList.add('show');}
function closeDialog(id){$('#'+id).classList.remove('show');}
function applyTheme(theme){document.documentElement.classList.toggle('dark',theme==='dark');try{localStorage.setItem('dai_theme_v1',theme);}catch(e){}$('#theme-light').classList.toggle('active',theme==='light');$('#theme-dark').classList.toggle('active',theme==='dark');}

function selectCharacter(id){if(!W.characters.some(c=>c.id===id))return;cancelGeneration();W.activeCharacterId=id;ensureConversation();save();renderAll();toggleSidebar(false);}

 const system='너는 가상 캐릭터와 대화하는 역할극 AI야. 캐릭터 이름: '+character.name+'. 성격과 배경: '+character.personality+'. 대화 상대의 이름: '+(character.userName||'플레이어')+'.\n\n자연스러운 메신저 대화처럼 캐릭터의 말투와 성격을 일관되게 유지해. 행동이나 표정은 *행동 묘사* 형식으로 표현할 수 있어. 지나치게 장황하지 않게 대화 흐름에 맞춰 답해.';
 const history=conv.messages.filter(m=>m.role==='user'||m.role==='assistant').slice(-24).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.text}]}));
 const answer=await DAIShared.generateContent({model:DAIShared.getModel('gemini-3.1-flash-lite'),payload:{systemInstruction:{parts:[{text:system}]},contents:history,generationConfig:{temperature:1,maxOutputTokens:2048}},signal});
 if(token!==generationToken)return;
 conv.messages.push({id:uid(),role:'assistant',text:answer.text,time:Date.now()});conv.updatedAt=Date.now();if(conv.title==='새 대화'){const first=conv.messages.find(m=>m.role==='user');if(first)conv.title=first.text.slice(0,36)+(first.text.length>36?'…':'');}save();
}
function logTranscript(entries,room){return entries.filter(x=>x.who!=='sys').slice(-24).map(x=>{const m=x.who==='me'?'나':room.members.find(y=>y.id===x.who)?.name||x.name||'멤버';return m+': '+x.text;}).join('\n')||'(아직 대화 없음)';}
async function groupReply(room,member,view,token,signal){
 const others=room.members.filter(m=>m.id!==member.id).map(m=>m.name+' ('+m.personality+')').join('\n')||'없음';const groupHistory=logTranscript(room.log,room);const dm=room.dms[member.id]||[];
 const system='너는 단체 모드 역할극 안에서 '+member.name+'이라는 캐릭터야.\n이 단체방의 세계관·상황: '+(room.worldSetting||'별도 세계관 설정 없이 자연스럽게 대화한다.')+'\n너의 성격: '+member.personality+'\n다른 멤버: '+others+'\n캐릭터 고유의 말투를 유지하고, 메신저에 보낼 다음 메시지만 작성해. 이름표나 서문을 붙이지 말고 자연스럽게 대답해. 단톡방에서 발언할 필요가 없으면 [PASS]만 반환해.';
 const prompt=view==='group'?'[이 단체방의 최근 대화]\n'+groupHistory+'\n\n'+member.name+'의 차례다. 메시지 하나를 작성해.':'[이 단체방의 세계관]\n'+(room.worldSetting||'별도 설정 없음')+'\n\n[같은 방의 단톡방 기록 — 배경으로만 참고]\n'+groupHistory+'\n\n[나와 '+member.name+'의 개인 DM]\n'+logTranscript(dm,room)+'\n\n'+member.name+'으로서 다음 DM을 작성해.';
 const answer=await DAIShared.generateContent({model:DAIShared.getModel('gemini-3.1-flash-lite'),payload:{systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:1,maxOutputTokens:1800}},signal});
 if(token!==generationToken)return null;
 const escapedName=member.name.replace(/[.*+?^\${}()|[\]\\]/g,'\\$&');let text=answer.text.replace(new RegExp('^\\s*["“]?'+escapedName+'["”]?\\s*[:：]\\s*'),'').trim();return /^\[?PASS\]?$/i.test(text)?'':text;
}
async function generateGroupTurn(roomId,view,memberId){
 const room=W.rooms.find(r=>r.id===roomId);if(!room)return;const member=room.members.find(m=>m.id===memberId);if(!member)return;
 const token=++generationToken;activeController=new AbortController();const signal=activeController.signal;generating=true;renderMessages();setBusy(true);
 try{const text=await groupReply(room,member,view,token,signal);if(token!==generationToken||!text)return;const latest=W.rooms.find(r=>r.id===roomId);if(!latest)return;appendCurrentLog(latest,view==='group'?'group':memberId,{who:member.id,name:member.name,text});renderAll();}
 catch(e){if(e?.name!=='AbortError'&&token===generationToken){const latest=W.rooms.find(r=>r.id===roomId);if(latest){appendCurrentLog(latest,view,{who:'sys',text:'오류: '+e.message});renderMessages();}}}
 finally{if(token===generationToken){activeController=null;generating=false;setBusy(false);renderHeader();renderMessages();renderSidebar();}}
}
async function sendOneToOne(text){
 const conv=ensureConversation();if(!conv)return;conv.messages.push({id:uid(),role:'user',text,time:Date.now()});conv.updatedAt=Date.now();save();renderSidebar();renderMessages();
 const token=++generationToken;activeController=new AbortController();const signal=activeController.signal;generating=true;setBusy(true);renderMessages();
 try{await oneToOneReply(conv,token,signal);if(token===generationToken){save();renderSidebar();}}
 catch(e){if(e?.name!=='AbortError'&&token===generationToken){conv.messages.push({id:uid(),role:'system',text:'AI 응답 오류: '+e.message,time:Date.now()});save();}}
 finally{if(token===generationToken){activeController=null;generating=false;setBusy(false);renderHeader();renderMessages();renderSidebar();}}
}
async function sendGroup(text){
 const room=currentRoom();if(!room)return;autoCountByRoom[room.id]=0;const view=activeGroupView();appendCurrentLog(room,view,{who:'me',name:'나',text});save();renderAll();
 if(view!=='group'){await generateGroupTurn(room.id,view,view);return;}
 if(!room.members.length){toast('먼저 방 설정에서 멤버를 추가해 주세요.');return;}
 const mentioned=room.members.filter(m=>text.includes('@'+m.name));let selected=mentioned;
 if(!selected.length){const count=Math.min(room.members.length,Math.random()<.72?1:2);selected=[...room.members].sort(()=>Math.random()-.5).slice(0,count);}
 for(const member of selected){if(!W.rooms.some(r=>r.id===room.id))break;await generateGroupTurn(room.id,'group',member.id);}
}
function submitMessage(event){event.preventDefault();if(generating)return;const input=$('#message-input');const text=input.value.trim();if(!text)return;if(!DAIShared.getApiKey()){openSettings();toast('먼저 공통 설정에 Gemini API 키를 입력해 주세요.');return;}input.value='';input.style.height='auto';if(W.mode==='one')sendOneToOne(text);else sendGroup(text);}
function handleNew(){if(W.mode==='one')createConversation();else createRoom();}
function exportCurrent(){let data,name;if(W.mode==='one'){const c=currentCharacter(),conv=currentConversation();data={type:'dai-one-to-one',character:c,conversation:conv};name=(c?.name||'character')+'-대화.json';}else{data={type:'dai-group-room',room:currentRoom()};name=(currentRoom()?.name||'group')+'-단체방.json';}const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('현재 데이터를 내보냈어요.');}
function openCurrentEdit(){if(W.mode==='one'){const c=currentCharacter();if(c)openCharacterEditor(c.id);}else{const r=currentRoom();if(r)openRoomEditor(r.id,false);}}
$('#side-list').addEventListener('click',e=>{
 const target=e.target.closest('button');if(!target)return;
 if(target.dataset.selectCharacter){selectCharacter(target.dataset.selectCharacter);return;}if(target.dataset.editCharacter){openCharacterEditor(target.dataset.editCharacter);return;}if(target.dataset.deleteCharacter){deleteCharacter(target.dataset.deleteCharacter);return;}if(target.dataset.selectConversation){selectConversation(target.dataset.selectConversation);return;}
 if(target.dataset.renameConversation){const c=currentCharacter(),conv=conversationsFor(c.id).find(x=>x.id===target.dataset.renameConversation);if(conv){const n=prompt('대화 이름',conv.title);if(n&&n.trim()){conv.title=n.trim().slice(0,80);save();renderAll();}}return;}
 if(target.dataset.deleteConversation){const c=currentCharacter();if(!confirm('이 대화를 삭제할까요?'))return;W.conversationsByCharacter[c.id]=conversationsFor(c.id).filter(x=>x.id!==target.dataset.deleteConversation);if(W.activeConversationByCharacter[c.id]===target.dataset.deleteConversation)W.activeConversationByCharacter[c.id]=null;ensureConversation();save();renderAll();return;}
 if(target.dataset.selectRoom){selectRoom(target.dataset.selectRoom);return;}if(target.dataset.editRoom){openRoomEditor(target.dataset.editRoom,false);return;}if(target.dataset.deleteRoom){deleteRoom(target.dataset.deleteRoom);return;}if(target.dataset.groupView){cancelGeneration();setGroupView(target.dataset.groupView);renderAll();toggleSidebar(false);}
});
$('#messages').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.copyMessage){const log=W.mode==='one'?currentConversation()?.messages:currentMessageLog(currentRoom(),activeGroupView());const m=log?.find(x=>x.id===b.dataset.copyMessage);if(m&&navigator.clipboard?.writeText)navigator.clipboard.writeText(m.text).then(()=>toast('복사했어요.')).catch(()=>toast('복사에 실패했어요.'));return;}
 if(b.dataset.deleteMessage){if(!confirm('이 메시지를 삭제할까요?'))return;if(W.mode==='one'){const conv=currentConversation();if(conv)conv.messages=conv.messages.filter(m=>m.id!==b.dataset.deleteMessage);}else{const log=currentMessageLog(currentRoom(),activeGroupView());const idx=log.findIndex(m=>m.id===b.dataset.deleteMessage);if(idx>=0)log.splice(idx,1);}save();renderAll();return;}
 if(b.dataset.regenerateMessage){regenerateMessage(b.dataset.regenerateMessage);return;}
});
async function regenerateMessage(id){
 if(generating)return;
 if(W.mode==='one'){const conv=currentConversation();if(!conv)return;const idx=conv.messages.findIndex(m=>m.id===id);if(idx<0)return;conv.messages.splice(idx,1);save();renderMessages();const token=++generationToken;activeController=new AbortController();const signal=activeController.signal;generating=true;setBusy(true);renderMessages();try{await oneToOneReply(conv,token,signal);if(token===generationToken)save();}catch(e){if(e?.name!=='AbortError'&&token===generationToken)conv.messages.push({id:uid(),role:'system',text:'AI 응답 오류: '+e.message,time:Date.now()});}finally{if(token===generationToken){activeController=null;generating=false;setBusy(false);renderAll();}}}
 else{const room=currentRoom();if(!room)return;const view=activeGroupView(),log=currentMessageLog(room,view),idx=log.findIndex(m=>m.id===id);if(idx<0)return;const memberId=log[idx].who;if(memberId==='me'||memberId==='sys')return;log.splice(idx,1);save();renderMessages();await generateGroupTurn(room.id,view,memberId);}
}
$('#editor-content').addEventListener('click',e=>{const remove=e.target.closest('[data-remove-member]');if(remove){editorDraft.room.members.splice(Number(remove.dataset.removeMember),1);renderRoomEditor();return;}if(e.target.closest('#add-character-to-room')){const id=$('#add-character-select')?.value;const char=W.characters.find(c=>c.id===id);if(!char)return toast('먼저 추가할 캐릭터를 선택해 주세요.');const hues=[215,275,38,150,340,190,95,15];editorDraft.room.members.push({id:uid(),sourceCharacterId:char.id,name:char.name,personality:char.personality||'',hue:hues[editorDraft.room.members.length%hues.length]});renderRoomEditor();}});
$('#editor-form').addEventListener('submit',saveEditor);
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>closeDialog(b.dataset.close)));
$$('.dialog').forEach(d=>d.addEventListener('mousedown',e=>{if(e.target===d)closeDialog(d.id);}));
$$('.mode-btn[data-mode]').forEach(b=>b.addEventListener('click',()=>switchMode(b.dataset.mode)));
$('#side-add').addEventListener('click',()=>W.mode==='one'?openCharacterEditor():createRoom());
$('#new-btn').addEventListener('click',handleNew);$('#edit-btn').addEventListener('click',openCurrentEdit);$('#export-btn').addEventListener('click',exportCurrent);$('#settings-open').addEventListener('click',openSettings);$('#save-settings').addEventListener('click',saveSettings);
$('#theme-light').addEventListener('click',()=>applyTheme('light'));$('#theme-dark').addEventListener('click',()=>applyTheme('dark'));
$('#auto-btn').addEventListener('click',()=>{const r=currentRoom();if(!r||W.mode!=='group')return;r.autoEnabled=!r.autoEnabled;autoCountByRoom[r.id]=0;save();renderHeader();renderSidebar();});
$('#composer-form').addEventListener('submit',submitMessage);
$('#message-input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px';});
$('#message-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();$('#composer-form').requestSubmit();}});
$('#mobile-menu').addEventListener('click',()=>toggleSidebar());$('#sidebar-overlay').addEventListener('click',()=>toggleSidebar(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$$('.dialog.show').forEach(d=>closeDialog(d.id));toggleSidebar(false);}});
window.addEventListener('beforeunload',()=>{if(activeController)activeController.abort();});
setInterval(async()=>{
 if(W.mode!=='group'||generating||!DAIShared.getApiKey())return;const room=currentRoom();if(!room||!room.autoEnabled||activeGroupView()!=='group'||room.members.length===0)return;const last=room.log[room.log.length-1],lastTime=last?.time||room.createdAt||Date.now();if(Date.now()-lastTime<room.autoInterval*1000)return;const count=autoCountByRoom[room.id]||0;if(count>=room.maxAuto)return;autoCountByRoom[room.id]=count+1;const previous=room.log.filter(m=>m.who!=='me').slice(-1)[0]?.who;const pool=room.members.filter(m=>m.id!==previous);const candidates=pool.length?pool:room.members;const member=candidates[Math.floor(Math.random()*candidates.length)];if(member)await generateGroupTurn(room.id,'group',member.id);
},1500);
if(!W.characters.length)W.characters=clone(DEFAULT_CHARACTERS);if(!W.rooms.length)W.rooms=[freshRoom()];if(!W.characters.some(c=>c.id===W.activeCharacterId))W.activeCharacterId=W.characters[0].id;if(!W.rooms.some(r=>r.id===W.activeRoomId))W.activeRoomId=W.rooms[0].id;if(!W.activeRoomView)W.activeRoomView={};if(!W.conversationsByCharacter)W.conversationsByCharacter={};if(!W.activeConversationByCharacter)W.activeConversationByCharacter={};
try{if(localStorage.getItem('dai_theme_v1')!=='light')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark');}catch(e){document.documentElement.classList.add('dark');}
if(W.mode==='one')ensureConversation();save();renderAll();setBusy(false);
})();
</script>
</body>
</html>
