<script src="shared-api.js"></script>
<style>
:root{color-scheme:dark;--bg:var(--dai-bg);--surface:var(--dai-surface);--surface2:var(--dai-surface2);--line:var(--dai-line);--ink:var(--dai-ink);--mute:var(--dai-mute);--accent:var(--dai-accent);--mint:#21d67a;--blue:#3b9eff;--danger:#fb7185}
html:not(.dark){color-scheme:light;--bg:var(--dai-bg);--surface:var(--dai-surface);--surface2:var(--dai-surface2);--line:var(--dai-line);--ink:var(--dai-ink);--mute:var(--dai-mute);--accent:var(--dai-accent)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:-.01em}
button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{width:292px;flex:0 0 292px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sidebar-top{padding:17px 15px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-bottom:17px}
.brand-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--mint),var(--blue));display:grid;place-items:center;flex:0 0 auto}
.brand-icon img{width:16px;height:16px;object-fit:cover;border-radius:4px}
.brand-name{font-size:15px;font-weight:800;letter-spacing:-.03em}.brand-d{color:var(--mint)}.brand-name em{font-style:normal;color:var(--blue)}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px}
.mode-btn{border:0;background:transparent;border-radius:999px;padding:9px 5px;font-size:12px;font-weight:700;color:var(--mute)}
.mode-btn.active{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.side-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 15px 8px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent}.btn.danger{color:var(--danger)}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:0 0 auto}.icon-btn:hover{border-color:var(--accent)}
#side-list{flex:1;min-height:0;overflow:auto;padding:0 10px 16px}
.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 8px 6px;color:var(--mute);font-size:10px;font-weight:800;letter-spacing:.04em}
.list-row{display:flex;align-items:center;gap:7px;padding:7px;border-radius:12px;margin-bottom:3px;border:1px solid transparent}
.list-row.active{background:var(--surface2);border-color:var(--line)}.list-row:hover{background:var(--surface2)}
.list-select{display:flex;align-items:center;gap:9px;flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.avatar{flex:0 0 30px;width:30px;height:30px;display:grid;place-items:center;border-radius:10px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--accent) 75%,var(--blue));color:white}
.list-copy{min-width:0;display:flex;flex-direction:column;gap:3px}.list-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-sub{font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;gap:1px}.mini-btn{border:0;background:transparent;color:var(--mute);width:25px;height:25px;border-radius:50%;font-size:12px;display:grid;place-items:center}.mini-btn:hover{background:var(--line);color:var(--ink)}
.nested{margin-left:12px;padding-left:9px;border-left:1px solid var(--line)}
.side-empty{font-size:11px;color:var(--mute);line-height:1.55;padding:7px 9px}
.side-bottom{padding:11px;border-top:1px solid var(--line);display:flex;gap:7px}.side-bottom .btn{flex:1}
.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100%;position:relative}
.header{height:66px;flex:0 0 66px;padding:0 clamp(12px,2.3vw,25px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px;background:color-mix(in srgb,var(--bg) 88%,transparent);z-index:2}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}.header-title{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-sub{font-size:11px;color:var(--mute);margin-top:3px}
.header-actions{display:flex;align-items:center;gap:6px}.header-actions .btn{padding:8px 11px}#mobile-menu{display:none}
.messages{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:900px;margin:0 auto;padding:23px clamp(14px,3vw,34px) 28px;display:flex;flex-direction:column;gap:17px}
.empty{margin:auto;text-align:center;max-width:455px;padding:35px 20px;color:var(--mute)}.empty-mark{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,var(--mint),var(--blue));display:grid;place-items:center;color:#06130c;font-size:20px;font-weight:900;margin:0 auto 18px}
.empty h1{font-size:23px;letter-spacing:-.04em;color:var(--ink);margin:0 0 10px}.empty p{font-size:13px;line-height:1.7;margin:0 0 16px}
.message{display:flex;gap:10px;max-width:88%;align-items:flex-start;animation:rise .18s ease-out}.message.me{align-self:flex-end;flex-direction:row-reverse}.message.ai{align-self:flex-start}
.message.system{align-self:center;max-width:100%;font-size:11px;color:var(--mute);text-align:center;background:var(--surface2);border:1px solid var(--line);padding:8px 12px;border-radius:12px;line-height:1.6}
.message .avatar{width:29px;height:29px;flex-basis:29px;border-radius:10px}.msg-col{min-width:0;display:flex;flex-direction:column;gap:5px}
.msg-meta{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--mute);padding:0 2px}.message.me .msg-meta{justify-content:flex-end}
.msg-bubble{font-size:14px;line-height:1.72;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--surface);padding:11px 14px;border-radius:17px}
.message.me .msg-bubble{background:color-mix(in srgb,var(--accent) 15%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,var(--line));border-top-right-radius:5px}.message.ai .msg-bubble{border-top-left-radius:5px}
.msg-actions{display:flex;gap:3px;opacity:.85}.message.me .msg-actions{justify-content:flex-end}.msg-actions button{border:0;background:transparent;color:var(--mute);border-radius:8px;padding:4px 6px;font-size:10px}.msg-actions button:hover{background:var(--surface2);color:var(--ink)}
.action-text{font-style:italic;color:var(--accent)}.mention{color:var(--accent);font-weight:700}
.typing{display:flex;align-items:center;gap:5px;padding:10px 13px;color:var(--mute);font-size:11px}.typing span{width:5px;height:5px;border-radius:50%;background:var(--mute);animation:bounce 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.composer-area{padding:10px 14px max(15px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}.composer-wrap{max-width:850px;margin:0 auto}
.composer{border:1px solid var(--line);background:var(--surface);border-radius:22px;display:flex;align-items:flex-end;gap:8px;padding:9px 10px 9px 15px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
#message-input{border:0;outline:0;resize:none;min-height:30px;max-height:160px;flex:1;background:transparent;color:var(--ink);font-size:14px;line-height:1.6;padding:5px 0}#message-input::placeholder{color:var(--mute)}
#send-btn{width:36px;height:36px;border:0;border-radius:50%;background:var(--accent);color:white;font-size:15px;flex:0 0 auto}.composer-note{text-align:center;font-size:10px;color:var(--mute);padding-top:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);backdrop-filter:blur(3px);z-index:40;display:none}.overlay.show{display:block}
.dialog{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.dialog.show{display:flex}
.dialog-card{background:var(--surface);border:1px solid var(--line);border-radius:23px;width:min(600px,100%);max-height:min(88dvh,860px);overflow:auto;padding:21px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.dialog-head h2{font-size:17px;margin:0}
.field-group{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field-group label{font-size:11px;font-weight:700;color:var(--mute)}
.field,.field-group input,.field-group textarea,.field-group select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:13px;outline:none}
.field-group textarea{resize:vertical;min-height:85px;line-height:1.6}.field-hint{font-size:10px;color:var(--mute);line-height:1.6;margin:0}
.dialog-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.member-card{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:11px;margin-bottom:9px}
.member-card-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.member-card-head input{flex:1;min-width:0}
.small-title{font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.03em;margin:17px 0 9px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--surface2);border:1px solid var(--line);padding:10px 15px;border-radius:999px;font-size:12px;z-index:90;transition:.2s;max-width:calc(100vw - 28px)}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes bounce{0%,70%,100%{opacity:.35;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
@media(max-width:760px){.sidebar{position:fixed;z-index:45;inset:0 auto 0 0;width:min(310px,88vw);transform:translateX(-105%);transition:transform .22s ease;box-shadow:15px 0 50px rgba(0,0,0,.2)}.sidebar.open{transform:translateX(0)}#mobile-menu{display:grid}.header{height:60px;flex-basis:60px;padding-inline:10px}.header-actions{gap:4px}.header-actions .btn .long-label{display:none}.header-actions .btn{padding:8px 10px}.messages{padding:17px 12px 23px}.message{max-width:96%}.msg-bubble{font-size:13.5px}.composer-area{padding-inline:9px}.dialog-card{padding:17px;border-radius:19px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="sidebar-top">
  <a class="brand" href="index.html"><div class="brand-icon"><img src="img/icon.png" alt="D-AI" onerror="this.style.display='none'"></div><div class="brand-name"><span class="brand-d">D-</span><em>AI</em> <span style="color:var(--mute);font-weight:600">Character</span></div></a>

  <div class="header-actions">
   <button class="btn quiet hidden" id="auto-btn" title="AI 자동 대화">▶ <span class="long-label">자동 대화</span></button>

 <div class="dialog-card">
  <div class="dialog-head"><h2 id="settings-title">공통 설정</h2><button class="icon-btn" data-close="settings-dialog" aria-label="닫기">✕</button></div>
  <div class="field-group"><label for="api-key">Gemini API 키</label><input id="api-key" type="password" autocomplete="off" placeholder="AIzaSy…"><p class="field-hint">일반 채팅·1:1 모드·단체 모드가 이 키를 공유합니다. 정적 사이트에서는 브라우저 저장소의 키를 완전히 숨길 수 없어요.</p></div>
  <div class="field-group"><label for="api-model">공통 모델 ID</label><input id="api-model" list="model-options" value="gemini-3.1-flash-lite" spellcheck="false"><datalist id="model-options"><option value="gemini-3.1-flash-lite"><option value="gemini-3.6-flash"><option value="gemini-3.5-flash-lite"></datalist><p class="field-hint">기본 모델은 Gemini 3.1 Flash-Lite예요. 사용 가능한 모델과 한도는 Google AI Studio 설정에 따라 달라져요.</p></div>
  <div class="field-group"><label>화면 테마</label><div class="mode-switch"><button class="mode-btn" id="theme-light" type="button">☀ 라이트</button><button class="mode-btn active" id="theme-dark" type="button">☾ 다크</button></div></div>

 </div>

<script>
(function(){
'use strict';
const $=function(s,r){return (r||document).querySelector(s);};
const $$=function(s,r){return Array.from((r||document).querySelectorAll(s));};
const uid=function(){return (crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));};
const esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
const clone=function(v){return JSON.parse(JSON.stringify(v));};
const fmt=function(v){return new Date(v||Date.now()).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});};
const DEFAULT_CHARACTERS=[{id:'character-eden',name:'이든',personality:'옆자리에 앉은 회사 동기로, 겉으로는 능청스럽고 장난기 가득한 태도로 농담을 던지지만 속으로는 상대의 컨디션과 기분을 세심하게 살피는 다정한 성격이다.',greeting:'*커피 두 잔을 들고 다가와 하나를 쓱 내민다* 어, 딱 맞춰 왔네. 무슨 일 있었어? 나한테 다 말해봐.',userName:'플레이어'}];
const DEFAULT_MEMBERS=[{id:'m-alpha',name:'알파',personality:'모임 총무. 이야기가 흩어지면 정리하고 다른 멤버에게 질문을 던진다.',hue:215},{id:'m-luna',name:'루나',personality:'호기심이 많고 엉뚱한 생각을 자주 한다. 새벽 감성이 있다.',hue:275},{id:'m-jay',name:'제이',personality:'개발자. 근거 없는 말에는 태클을 걸지만 은근히 사람을 잘 챙긴다.',hue:38},{id:'m-baby',name:'베이비',personality:'막내. 눈치 안 보고 생각나는 대로 던진다.',hue:150}];
const STORE='dai_character_workspace_v2';
function freshRoom(name){return {id:uid(),name:name||'일반 채팅방',log:[],dms:{},autoEnabled:false,autoInterval:25,maxAuto:6,createdAt:Date.now()};}
function freshWorld(name,withDefaults){return {id:uid(),name:name||'새 세계관',setting:'',members:withDefaults?clone(DEFAULT_MEMBERS):[],rooms:[freshRoom()],createdAt:Date.now()};}
function loadState(){
 try{const raw=localStorage.getItem(STORE);if(raw){const v=JSON.parse(raw);if(v&&Array.isArray(v.characters)&&Array.isArray(v.worlds))return v;}}catch(e){}
 const world=freshWorld('기본 세계관',false);
 return {version:2,mode:'one',characters:clone(DEFAULT_CHARACTERS),worlds:[world],activeCharacterId:'character-eden',activeWorldId:world.id,activeRoomByWorld:{[world.id]:world.rooms[0].id},activeViewByRoom:{},conversationsByCharacter:{},activeConversationByCharacter:{}};
}
let S=loadState(),busy=false,token=0,controller=null,draft=null,toastTimer=null,autoCounts={};
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){toast('저장 공간이 부족해요. 대화를 내보내고 오래된 기록을 정리해 주세요.');}}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},2600);}
function currentCharacter(){return S.characters.find(function(c){return c.id===S.activeCharacterId;})||null;}
function currentWorld(){return S.worlds.find(function(w){return w.id===S.activeWorldId;})||null;}
function currentRoom(){const w=currentWorld();if(!w)return null;return w.rooms.find(function(r){return r.id===S.activeRoomByWorld[w.id];})||w.rooms[0]||null;}
function roomView(){const r=currentRoom();return r?S.activeViewByRoom[r.id]||'group':'group';}
function getConversations(id){if(!S.conversationsByCharacter[id])S.conversationsByCharacter[id]=[];return S.conversationsByCharacter[id];}
function currentConversation(){const c=currentCharacter();if(!c)return null;return getConversations(c.id).find(function(v){return v.id===S.activeConversationByCharacter[c.id];})||null;}
function ensureConversation(){const c=currentCharacter();if(!c)return null;let v=currentConversation();if(v)return v;v={id:uid(),characterId:c.id,title:'새 대화',createdAt:Date.now(),updatedAt:Date.now(),messages:[]};if(c.greeting)v.messages.push({id:uid(),role:'assistant',text:c.greeting,time:Date.now()});getConversations(c.id).unshift(v);S.activeConversationByCharacter[c.id]=v.id;save();return v;}
function activeLog(room,view){return view==='group'?room.log:(room.dms[view]||(room.dms[view]=[]));}
function cancelGeneration(){token++;if(controller){try{controller.abort();}catch(e){}controller=null;}busy=false;setBusy(false);}

function openDialog(id){$('#'+id).classList.add('show');}

function switchMode(mode){if(S.mode===mode)return;cancelGeneration();S.mode=mode;save();renderAll();toggleSidebar(false);}
function toggleSidebar(force){const open=force===undefined?!$('#sidebar').classList.contains('open'):force;$('#sidebar').classList.toggle('open',open);$('#sidebar-overlay').classList.toggle('show',open);}
function makeConversation(){const c=currentCharacter();if(!c)return;const v={id:uid(),characterId:c.id,title:'새 대화',createdAt:Date.now(),updatedAt:Date.now(),messages:[]};if(c.greeting)v.messages.push({id:uid(),role:'assistant',text:c.greeting,time:Date.now()});getConversations(c.id).unshift(v);S.activeConversationByCharacter[c.id]=v.id;save();renderAll();}
function selectCharacter(id){if(!S.characters.some(function(c){return c.id===id;}))return;cancelGeneration();S.activeCharacterId=id;ensureConversation();save();renderAll();toggleSidebar(false);}
function selectWorld(id){if(!S.worlds.some(function(w){return w.id===id;}))return;cancelGeneration();S.activeWorldId=id;const w=currentWorld();if(w&&!S.activeRoomByWorld[w.id]&&w.rooms[0])S.activeRoomByWorld[w.id]=w.rooms[0].id;save();renderAll();toggleSidebar(false);}

function selectView(value){const r=currentRoom();if(!r)return;cancelGeneration();S.activeViewByRoom[r.id]=value;save();renderAll();toggleSidebar(false);}
function selectConversation(id){const c=currentCharacter();if(!c)return;if(!getConversations(c.id).some(function(v){return v.id===id;}))return;cancelGeneration();S.activeConversationByCharacter[c.id]=id;save();renderAll();toggleSidebar(false);}

function escapeForRegex(v){return String(v).replace(/[.*+?^$()|[\]\\]/g,'\\$&');}
function formatMarkup(text,w){let html=esc(text).replace(/\[\*([^*\]]+)\*\]/g,'<span class="action-text">$1</span>').replace(/\*([^\*\n]+)\*/g,'<span class="action-text">$1</span>').replace(/\n/g,'<br>');if(w)w.members.forEach(function(m){html=html.replace(new RegExp('@'+escapeForRegex(m.name),'g'),'<span class="mention">@'+esc(m.name)+'</span>');});return html;}
function renderMessages(){
 const box=$('#messages');box.innerHTML='';let log=[],w=null,r=null,view='group';
 if(S.mode==='one'){const v=ensureConversation();log=(v?v.messages:[]).map(function(m){return Object.assign({},m,{who:m.role==='user'?'me':m.role==='system'?'sys':'ai',name:m.role==='user'?(currentCharacter().userName||'나'):currentCharacter().name});});}
 else{w=currentWorld();r=currentRoom();view=roomView();if(r)log=activeLog(r,view).map(function(m){return Object.assign({},m,{who:m.who==='me'?'me':m.who==='sys'?'sys':'ai',name:m.who==='me'?'나':w.members.find(function(x){return x.id===m.who;})?.name||m.name||'멤버'});});}
 if(!log.length){const text=S.mode==='one'?'캐릭터와 대화를 시작해 보세요.':'이 채팅방에서 대화를 시작해 보세요.';box.innerHTML='<div class="empty"><div class="empty-mark">'+(S.mode==='one'?'✦':'#')+'</div><h1>'+text+'</h1><p>'+(S.mode==='one'?'캐릭터의 성격과 첫 인사는 캐릭터 설정에서 바꿀 수 있어요.':'세계관과 멤버는 왼쪽의 세계관 설정에서 관리하고, 방을 추가하면 같은 세계관 안에서 별도 대화를 만들 수 있어요.')+'</p>'+(S.mode==='group'&&!w.members.length?'<button class="btn primary" data-empty-edit-world>세계관에 AI 멤버 추가</button>':'')+'</div>';return;}
 log.forEach(function(m,i){const row=document.createElement('article');if(m.who==='sys'||m.role==='system'){row.className='message system';row.textContent=m.text;box.appendChild(row);return;}const mine=m.who==='me';row.className='message '+(mine?'me':'ai');let actions='<div class="msg-actions"><button data-copy="'+esc(m.id)+'">복사</button><button data-delete="'+esc(m.id)+'">삭제</button>'+(!mine&&i===log.length-1?'<button data-regen="'+esc(m.id)+'">다시 생성</button>':'')+'</div>';row.innerHTML='<div class="avatar">'+esc((m.name||'?').charAt(0))+'</div><div class="msg-col"><div class="msg-meta"><strong>'+esc(m.name||'AI')+'</strong><span>'+esc(fmt(m.time||m.createdAt))+'</span></div><div class="msg-bubble">'+formatMarkup(m.text||'',S.mode==='group'?w:null)+'</div>'+actions+'</div>';box.appendChild(row);});
 if(busy){const row=document.createElement('div');row.className='message ai';row.innerHTML='<div class="avatar">✦</div><div class="msg-col"><div class="typing"><span></span><span></span><span></span> 답변 생성 중</div></div>';box.appendChild(row);}box.scrollTop=box.scrollHeight;
}
function renderAll(){renderSidebar();renderHeader();renderMessages();$$('.mode-btn[data-mode]').forEach(function(b){b.classList.toggle('active',b.dataset.mode===S.mode);});}
function addMessage(log,msg){msg.id=msg.id||uid();msg.time=msg.time||Date.now();log.push(msg);if(log.length>300)log.splice(0,log.length-300);save();}
async function askAI(system,contents,signal,maxTokens){return DAIShared.generateContent({model:DAIShared.getModel('gemini-3.1-flash-lite'),payload:{systemInstruction:{parts:[{text:system}]},contents:contents,generationConfig:{temperature:1,maxOutputTokens:maxTokens||2048}},signal:signal});}
async function replyCharacter(conv,myToken,signal){
 const c=S.characters.find(function(x){return x.id===conv.characterId;})||currentCharacter();const history=conv.messages.filter(function(m){return m.role==='user'||m.role==='assistant';}).slice(-28).map(function(m){return {role:m.role==='assistant'?'model':'user',parts:[{text:m.text}]};});
 const system='너는 가상 캐릭터 대화용 AI야. 이름: '+c.name+'. 성격과 배경: '+c.personality+'. 대화 상대 이름: '+(c.userName||'플레이어')+'.\\n\\n캐릭터의 말투와 성격을 일관되게 유지해. 행동이나 표정은 *행동 묘사*로 표현할 수 있어. 실시간 메신저처럼 상황에 맞게 자연스럽게 답해.';
 const result=await askAI(system,history,signal,2048);if(myToken!==token)return;
 conv.messages.push({id:uid(),role:'assistant',text:result.text,time:Date.now()});conv.updatedAt=Date.now();const first=conv.messages.find(function(m){return m.role==='user';});if(conv.title==='새 대화'&&first)conv.title=first.text.slice(0,36)+(first.text.length>36?'…':'');save();
}
function transcript(log,w){return log.filter(function(m){return m.who!=='sys';}).slice(-28).map(function(m){return (m.who==='me'?'나':w.members.find(function(x){return x.id===m.who;})?.name||m.name||'멤버')+': '+m.text;}).join('\n')||'(아직 대화 없음)';}
async function replyMember(w,r,view,member,myToken,signal){
 const otherMembers=w.members.filter(function(m){return m.id!==member.id;}).map(function(m){return m.name+' — '+m.personality;}).join('\n')||'없음';
 const dm=r.dms[member.id]||[];
 const groupHistory=transcript(r.log,w),dmHistory=transcript(dm,w);
 const system='너는 D-AI 단체 모드의 가상 캐릭터 "'+member.name+'"이야. 세계관: '+(w.setting||'별도 설정 없이 자연스럽게 대화한다.')+'\\n너의 성격: '+member.personality+'\\n같은 세계관의 다른 AI 멤버: '+otherMembers+'\\n\\n다른 세계관과 다른 채팅방의 구체적인 사건이나 대화는 기억하거나 알고 있다고 가정하지 마. 현재 선택된 대화 맥락만 참고하고, 메신저에 보낼 다음 메시지 내용만 작성해. 필요 없는 이름표나 서문은 붙이지 마.';
 const prompt=view==='group'?'[현재 채팅방의 전체 대화]\\n'+groupHistory+'\\n\\n[같은 채팅방에서 이 멤버와 나눈 개인 DM — 별도 맥락 참고]\\n'+dmHistory+'\\n\\n'+member.name+'의 차례다. 이 채팅방에서 자연스럽게 답할 메시지 하나를 작성해. 말할 필요가 없으면 [PASS]만 반환해.':'[현재 채팅방의 전체 대화 — 배경 참고]\\n'+groupHistory+'\\n\\n[나와 '+member.name+'의 개인 DM 기록]\\n'+dmHistory+'\\n\\n이 DM 안에서 이어질 다음 메시지만 작성해.';
 const result=await askAI(system,[{role:'user',parts:[{text:prompt}]}],signal,1800);if(myToken!==token)return null;
 let text=result.text.replace(new RegExp('^\\s*["“]?'+escapeForRegex(member.name)+'["”]?\\s*[:：]\\s*'),'').trim();return /^\[?PASS\]?$/i.test(text)?'':text;
}
async function requestMember(worldId,roomId,view,memberId){
 const w=S.worlds.find(function(x){return x.id===worldId;});const r=w&&w.rooms.find(function(x){return x.id===roomId;});const m=w&&w.members.find(function(x){return x.id===memberId;});if(!w||!r||!m)return;
 const myToken=++token;controller=new AbortController();const signal=controller.signal;busy=true;setBusy(true);renderMessages();
 try{const text=await replyMember(w,r,view,m,myToken,signal);if(myToken!==token||!text)return;addMessage(activeLog(r,view),{who:m.id,name:m.name,text:text});}
 catch(e){if(e&&e.name!=='AbortError'&&myToken===token)addMessage(activeLog(r,view),{who:'sys',text:'AI 오류: '+e.message});}
 finally{if(myToken===token){controller=null;busy=false;setBusy(false);renderAll();}}
}
async function sendOne(text){
 const c=currentCharacter(),v=ensureConversation();if(!c||!v)return;v.messages.push({id:uid(),role:'user',text:text,time:Date.now()});v.updatedAt=Date.now();save();renderAll();
 const myToken=++token;controller=new AbortController();busy=true;setBusy(true);renderMessages();
 try{await replyCharacter(v,myToken,controller.signal);}
 catch(e){if(e&&e.name!=='AbortError'&&myToken===token)v.messages.push({id:uid(),role:'system',text:'AI 오류: '+e.message,time:Date.now()});}
 finally{if(myToken===token){controller=null;busy=false;setBusy(false);save();renderAll();}}
}
async function sendGroup(text){
 const w=currentWorld(),r=currentRoom();if(!w||!r)return;const view=roomView();autoCounts[r.id]=0;addMessage(activeLog(r,view),{who:'me',name:'나',text:text});renderAll();
 if(view!=='group'){await requestMember(w.id,r.id,view,view);return;}
 if(!w.members.length){toast('세계관 설정에서 AI 멤버를 추가해 주세요.');return;}
 const mentioned=w.members.filter(function(m){return text.includes('@'+m.name);});
 const selected=mentioned.length?mentioned.slice():w.members.slice().sort(function(){return Math.random()-.5;}).slice(0,Math.min(w.members.length,Math.random()<.7?1:2));
 for(let i=0;i<selected.length;i++){if(!S.worlds.some(function(x){return x.id===w.id;}))break;await requestMember(w.id,r.id,'group',selected[i].id);}
}
function submit(e){e.preventDefault();if(busy)return;const input=$('#message-input'),text=input.value.trim();if(!text)return;if(!DAIShared.getApiKey()){openSettings();toast('공통 설정에서 Gemini API 키를 입력해 주세요.');return;}input.value='';input.style.height='auto';if(S.mode==='one')sendOne(text);else sendGroup(text);}
function exportCurrent(){
 let data,name;if(S.mode==='one'){data={type:'dai-character-chat-v2',character:currentCharacter(),conversation:currentConversation()};name=(currentCharacter()?.name||'캐릭터')+'-대화.json';}
 else{const w=currentWorld(),r=currentRoom();data={type:'dai-world-v2',world:w,room:r,view:roomView()};name=(w?.name||'세계관')+'-'+(r?.name||'채팅방')+'.json';}
 const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);toast('현재 데이터를 내보냈어요.');
}
function importFile(file){if(!file)return;const reader=new FileReader();reader.onload=function(){try{const d=JSON.parse(String(reader.result||''));if(d.type==='dai-character-chat-v2'&&d.character){const c=Object.assign({},d.character,{id:uid()});S.characters.unshift(c);S.activeCharacterId=c.id;S.mode='one';if(d.conversation){const v=Object.assign({},d.conversation,{id:uid(),characterId:c.id,createdAt:Date.now(),updatedAt:Date.now()});S.conversationsByCharacter[c.id]=[v];S.activeConversationByCharacter[c.id]=v.id;}else S.conversationsByCharacter[c.id]=[];ensureConversation();}
 else if(d.type==='dai-world-v2'&&d.world){const w=clone(d.world),idMap={};w.id=uid();w.name=(w.name||'가져온 세계관')+' (가져옴)';w.members=(w.members||[]).map(function(m){const old=m.id;m.id=uid();idMap[old]=m.id;return m;});w.rooms=(w.rooms||[]).map(function(r){r.id=uid();r.log=(r.log||[]).map(function(m){return Object.assign({},m,{who:idMap[m.who]||m.who});});const nd={};Object.keys(r.dms||{}).forEach(function(old){nd[idMap[old]||old]=(r.dms[old]||[]).map(function(m){return Object.assign({},m,{who:idMap[m.who]||m.who});});});r.dms=nd;return r;});S.worlds.unshift(w);S.activeWorldId=w.id;S.activeRoomByWorld[w.id]=w.rooms[0]?.id;S.mode='group';}
 else throw new Error('이 통합 페이지에서 내보낸 JSON 파일만 불러올 수 있어요.');save();closeDialog('editor-dialog');renderAll();toast('파일을 불러왔어요.');}
 catch(e){toast('불러오기에 실패했어요: '+e.message);}};reader.onerror=function(){toast('파일을 읽을 수 없어요.');};reader.readAsText(file);}
function resetCurrent(){if(busy)cancelGeneration();if(S.mode==='one'){const c=currentCharacter(),v=currentConversation();if(!c||!v)return;if(!confirm('현재 1:1 대화를 초기화할까요?'))return;v.messages=c.greeting?[{id:uid(),role:'assistant',text:c.greeting,time:Date.now()}]:[];v.title='새 대화';v.updatedAt=Date.now();}
 else{const r=currentRoom();if(!r)return;const view=roomView();if(!confirm(view==='group'?'현재 채팅방의 전체 대화를 지울까요?':'현재 채팅방에서 이 멤버와 나눈 DM을 지울까요?'))return;if(view==='group')r.log=[];else r.dms[view]=[];autoCounts[r.id]=0;}save();renderAll();}
function editCurrent(){if(S.mode==='one')openCharacterEditor(currentCharacter()?.id);else openWorldEditor(currentWorld()?.id,false);}
function renameConversation(id){const c=currentCharacter();const v=getConversations(c.id).find(function(x){return x.id===id;});if(!v)return;const name=prompt('대화 이름 변경',v.title);if(name&&name.trim()){v.title=name.trim().slice(0,90);save();renderAll();}}
function handleSidebar(e){
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.selectCharacter)return selectCharacter(b.dataset.selectCharacter);
 if(b.dataset.editCharacter)return openCharacterEditor(b.dataset.editCharacter);
 if(b.dataset.deleteCharacter)return deleteCharacter(b.dataset.deleteCharacter);
 if(b.dataset.selectConv)return selectConversation(b.dataset.selectConv);
 if(b.dataset.renameConv)return renameConversation(b.dataset.renameConv);
 if(b.dataset.deleteConv)return deleteConversation(b.dataset.deleteConv);
 if(b.dataset.selectWorld)return selectWorld(b.dataset.selectWorld);
 if(b.dataset.editWorld)return openWorldEditor(b.dataset.editWorld,false);
 if(b.dataset.deleteWorld)return deleteWorld(b.dataset.deleteWorld);
 if(b.dataset.newRoom){const w=currentWorld();if(w)newRoom(w);return;}
 if(b.dataset.selectRoom)return selectRoom(b.dataset.selectRoom);
 if(b.dataset.editRoom)return openRoomEditor(b.dataset.editRoom,false);
 if(b.dataset.deleteRoom)return deleteRoom(b.dataset.deleteRoom);
 if(b.dataset.selectView!==undefined)return selectView(b.dataset.selectView);
}
$('#side-list').addEventListener('click',handleSidebar);
$('#messages').addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.emptyEditWorld!==undefined){openWorldEditor(currentWorld().id,false);return;}
 if(b.dataset.copy){let log=S.mode==='one'?currentConversation()?.messages:activeLog(currentRoom(),roomView());const m=log&&log.find(function(x){return x.id===b.dataset.copy;});if(m&&navigator.clipboard?.writeText)navigator.clipboard.writeText(m.text).then(function(){toast('복사했어요.');}).catch(function(){toast('복사하지 못했어요.');});return;}
 if(b.dataset.delete){if(!confirm('이 메시지를 삭제할까요?'))return;let log=S.mode==='one'?currentConversation()?.messages:activeLog(currentRoom(),roomView());if(log){const i=log.findIndex(function(x){return x.id===b.dataset.delete;});if(i>=0)log.splice(i,1);}save();renderAll();return;}
 if(b.dataset.regen)regenerate(b.dataset.regen);
});
async function regenerate(id){if(busy)return;if(S.mode==='one'){const v=currentConversation();if(!v)return;const i=v.messages.findIndex(function(m){return m.id===id;});if(i<0)return;v.messages.splice(i,1);save();const myToken=++token;controller=new AbortController();busy=true;setBusy(true);renderMessages();try{await replyCharacter(v,myToken,controller.signal);}catch(e){if(e&&e.name!=='AbortError'&&myToken===token)v.messages.push({id:uid(),role:'system',text:'AI 오류: '+e.message,time:Date.now()});}finally{if(myToken===token){controller=null;busy=false;setBusy(false);save();renderAll();}}}
 else{const w=currentWorld(),r=currentRoom(),view=roomView();if(!w||!r)return;const log=activeLog(r,view),i=log.findIndex(function(m){return m.id===id;});if(i<0||log[i].who==='me'||log[i].who==='sys')return;const memberId=log[i].who;log.splice(i,1);save();renderMessages();await requestMember(w.id,r.id,view,memberId);}}
$('#editor-content').addEventListener('click',function(e){if(e.target.closest('#add-world-member')){addWorldMember();return;}const b=e.target.closest('[data-remove-member]');if(b&&draft&&draft.type==='world'){draft.world.members.splice(Number(b.dataset.removeMember),1);renderWorldEditor();}});
$('#editor-form').addEventListener('submit',saveEditor);
$$('[data-close]').forEach(function(b){b.addEventListener('click',function(){closeDialog(b.dataset.close);draft=null;});});
$$('.dialog').forEach(function(d){d.addEventListener('mousedown',function(e){if(e.target===d){closeDialog(d.id);draft=null;}});});
$$('.mode-btn[data-mode]').forEach(function(b){b.addEventListener('click',function(){switchMode(b.dataset.mode);});});
$('#side-add').addEventListener('click',function(){if(S.mode==='one')openCharacterEditor();else newWorld();});
$('#new-btn').addEventListener('click',function(){if(S.mode==='one')makeConversation();else{const w=currentWorld();if(w)newRoom(w);}});
$('#edit-btn').addEventListener('click',editCurrent);$('#export-btn').addEventListener('click',exportCurrent);
$('#import-btn').addEventListener('click',function(){$('#import-file').click();});$('#import-file').addEventListener('change',function(e){importFile(e.target.files?.[0]);e.target.value='';});
$('#reset-btn').addEventListener('click',resetCurrent);$('#settings-open').addEventListener('click',openSettings);$('#save-settings').addEventListener('click',saveSettings);
$('#theme-light').addEventListener('click',function(){applyTheme('light');});$('#theme-dark').addEventListener('click',function(){applyTheme('dark');});
$('#auto-btn').addEventListener('click',function(){const r=currentRoom();if(!r||roomView()!=='group')return;r.autoEnabled=!r.autoEnabled;autoCounts[r.id]=0;save();renderHeader();renderSidebar();toast(r.autoEnabled?'자동 대화를 켰어요.':'자동 대화를 껐어요.');});
$('#send-btn').addEventListener('click',function(e){if(busy){e.preventDefault();e.stopPropagation();cancelGeneration();renderAll();toast('응답 생성을 중지했어요.');}});
$('#composer-form').addEventListener('submit',submit);
$('#message-input').addEventListener('input',function(e){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px';});
$('#message-input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();$('#composer-form').requestSubmit();}});
$('#mobile-menu').addEventListener('click',function(){toggleSidebar();});$('#sidebar-overlay').addEventListener('click',function(){toggleSidebar(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){$$('.dialog.show').forEach(function(d){closeDialog(d.id);});toggleSidebar(false);draft=null;}});
window.addEventListener('beforeunload',function(){if(controller)controller.abort();});
setInterval(async function(){if(S.mode!=='group'||busy||!DAIShared.getApiKey())return;const w=currentWorld(),r=currentRoom();if(!w||!r||!r.autoEnabled||roomView()!=='group'||!w.members.length)return;const last=r.log[r.log.length-1],lastTime=last?.time||r.createdAt||Date.now();if(Date.now()-lastTime<r.autoInterval*1000)return;const n=autoCounts[r.id]||0;if(n>=r.maxAuto)return;autoCounts[r.id]=n+1;const previous=r.log.filter(function(m){return m.who!=='me';}).slice(-1)[0]?.who;const pool=w.members.filter(function(m){return m.id!==previous;});const candidates=pool.length?pool:w.members;const m=candidates[Math.floor(Math.random()*candidates.length)];if(m)await requestMember(w.id,r.id,'group',m.id);},1500);
if(!S.characters.length)S.characters=clone(DEFAULT_CHARACTERS);if(!S.worlds.length)S.worlds.push(freshWorld('기본 세계관',false));if(!S.conversationsByCharacter)S.conversationsByCharacter={};if(!S.activeConversationByCharacter)S.activeConversationByCharacter={};if(!S.activeRoomByWorld)S.activeRoomByWorld={};if(!S.activeViewByRoom)S.activeViewByRoom={};if(!S.characters.some(function(c){return c.id===S.activeCharacterId;}))S.activeCharacterId=S.characters[0].id;if(!S.worlds.some(function(w){return w.id===S.activeWorldId;}))S.activeWorldId=S.worlds[0].id;S.worlds.forEach(function(w){if(!Array.isArray(w.rooms))w.rooms=[];if(!w.rooms.length)w.rooms.push(freshRoom());if(!S.activeRoomByWorld[w.id]||!w.rooms.some(function(r){return r.id===S.activeRoomByWorld[w.id];}))S.activeRoomByWorld[w.id]=w.rooms[0].id;});
if(S.mode==='one')ensureConversation();save();renderAll();setBusy(false);
})();</script>
